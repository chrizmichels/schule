<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreiDay-Einsätze 4b</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Caveat:wght@600;700&display=swap">
<style>
/* FreiDay-Einsätze: Stil «Wegmarke» (grün, sonnengelb, Handschrift). Basis-Layout stammt von den Klimadetektiven, Farben und Formen sind unten im Block «FreiDay-Look» überschrieben. */
:root{--desk:#dde3de;--folder:#e7d6ae;--folder-edge:#cdb886;--paper:#fbfaf6;--ink:#1c2420;--muted:#5b6660;--rule:#d4d9d3;--stamp:#b3302a;--ok:#1d7f4c;--ok-soft:#ddf0e3;--bad:#b3302a;--bad-soft:#f8e1dd;--hl:#f2d24b;--hl-soft:#f7ebb0;--blue:#2d62c4;--orange:#c9661a;--cold:#cfe0f7;
 --f-display:"Zilla Slab",Rockwell,Georgia,serif;--f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;--f-type:"Courier Prime","Courier New",ui-monospace,monospace;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.5}
main{max-width:1000px;margin:0 auto;padding:30px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:6px 0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.muted{color:var(--muted);font-size:.9rem}
.lbl{font-family:var(--f-type);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Titelblatt */
.cover{background:var(--folder);border:1px solid var(--folder-edge);border-radius:4px 14px 14px 14px;padding:26px clamp(18px,4vw,40px) 26px;position:relative;display:flex;flex-direction:column;gap:14px;margin-top:30px}
.cover::before{content:"Aktenzeichen 4b.K.1";position:absolute;top:-30px;left:-1px;background:var(--folder);border:1px solid var(--folder-edge);border-bottom:0;border-radius:10px 10px 0 0;padding:5px 16px 4px;font-family:var(--f-type);font-size:13px;color:var(--muted)}
.cover h1{font-family:var(--f-display);font-weight:700;font-size:clamp(40px,8vw,72px);line-height:.98;letter-spacing:-.01em}
.cover h1 span{display:block;font-size:.34em;letter-spacing:.14em;text-transform:uppercase;font-family:var(--f-type);font-weight:700;color:var(--muted);margin-bottom:8px}
.cover p{max-width:44ch;margin:0}
.bigstamp{position:absolute;right:clamp(14px,4vw,40px);top:22px;border:4px solid var(--stamp);color:var(--stamp);font-family:var(--f-type);font-weight:700;font-size:clamp(13px,2.2vw,19px);letter-spacing:.12em;padding:6px 12px;border-radius:6px;transform:rotate(-9deg);text-align:center;line-height:1.15;opacity:.85;animation:slam .5s cubic-bezier(.3,1.4,.6,1)}
.bigstamp b{display:block;font-size:2em;letter-spacing:.04em}
@keyframes slam{0%{transform:rotate(-9deg) scale(2.2);opacity:0}60%{transform:rotate(-9deg) scale(.94);opacity:.95}100%{transform:rotate(-9deg) scale(1);opacity:.85}}
@media (prefers-reduced-motion:reduce){.bigstamp{animation:none}}
@media (max-width:620px){.bigstamp{position:static;align-self:flex-start;transform:rotate(-4deg);animation:none}}
.now{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;background:var(--paper);border:1px solid var(--folder-edge);border-radius:10px;padding:10px 14px;align-self:flex-start}
.now b{font-family:var(--f-display);font-size:1.7rem;line-height:1}
.now small{color:var(--muted);font-family:var(--f-type);font-size:13px}

/* Akten (Fälle) */
.files{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:34px 18px;margin-top:34px}
@media (max-width:860px){.files{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:540px){.files{grid-template-columns:1fr}}
.file{position:relative;background:var(--folder);border:1px solid var(--folder-edge);border-radius:0 10px 10px 10px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.file .tab{position:absolute;top:-25px;left:-1px;background:var(--folder);border:1px solid var(--folder-edge);border-bottom:0;border-radius:8px 8px 0 0;padding:3px 14px 2px;font-family:var(--f-type);font-size:13px;font-weight:700}
.file h3{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.05;text-transform:none;letter-spacing:0;color:var(--ink);margin:0}
.file p{margin:0;color:var(--muted);font-size:17px}
.file .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:8px}
.stars{font-size:26px;line-height:1;color:var(--folder-edge)}
.stars.on{color:var(--stamp)}
.open{background:var(--ink);color:var(--paper);border:0;border-radius:8px;padding:11px 16px;font-weight:700;min-height:46px}
.open:hover{filter:brightness(1.2)}
.solvedst{position:absolute;right:12px;top:10px;border:3px solid var(--stamp);color:var(--stamp);font-family:var(--f-type);font-weight:700;font-size:14px;letter-spacing:.12em;padding:2px 8px;border-radius:4px;transform:rotate(8deg);opacity:.85}

/* Spielleiste und Karte */
.gbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--folder);border:1px solid var(--folder-edge);border-radius:12px;padding:12px 16px;margin-bottom:16px}
.gbar .ttl{font-family:var(--f-display);font-weight:700;font-size:28px;flex:1;min-width:0;line-height:1.1}
.gbar .ttl small{display:block;font-family:var(--f-type);font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;font-weight:400}
.back{background:var(--paper);border:1px solid var(--folder-edge);border-radius:8px;padding:10px 14px;min-height:46px;font-weight:700}
.back:hover{border-color:var(--ink)}
.qcard{background:var(--paper);border:1px solid var(--rule);border-radius:4px 14px 14px 14px;padding:clamp(16px,3.5vw,30px);box-shadow:0 1px 0 var(--rule),0 8px 24px rgba(20,30,25,.08)}
h3{font-family:var(--f-type);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:18px 0 6px}
.q{font-family:var(--f-display);font-size:clamp(24px,3.6vw,30px);font-weight:700;line-height:1.2;margin:20px 0 6px}
.steps{display:flex;gap:6px;margin:0 0 4px;padding:0;list-style:none}
.steps li{flex:1;display:flex;flex-direction:column;gap:5px;font-family:var(--f-type);font-size:13px;font-weight:700;color:var(--muted)}
.steps li::before{content:"";height:10px;border-radius:3px;background:var(--rule)}
.steps li.done::before{background:var(--ok)}
.steps li.on::before{background:var(--ink)}
.steps li.on{color:var(--ink)}
.steps li i{display:none}

/* Auswahl */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.chip{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:52px;padding:6px 16px;border:2px solid var(--rule);border-radius:10px;background:var(--desk);font-weight:700;line-height:1.15;font-size:18px}
.chip small{font-weight:400;font-size:13px;color:var(--muted);font-family:var(--f-type)}
.chip:hover:not(:disabled){border-color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[aria-pressed=true] small{color:#cfd6d1}
.chip:disabled{opacity:.4;cursor:not-allowed}
.chips input[type=date]{font:inherit;min-height:52px;border:2px solid var(--rule);border-radius:10px;padding:4px 10px;background:var(--desk);color:var(--ink)}
.opts{display:grid;gap:10px;margin:10px 0}
.opts.two{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:12px 16px;border:2px solid var(--rule);border-radius:10px;background:var(--desk);text-align:left;font-weight:700;font-size:20px;line-height:1.2;transition:transform .08s}
.opt small{display:block;font-family:var(--f-type);font-weight:400;font-size:14px;color:var(--muted)}
.opt:hover{border-color:var(--ink);transform:translateY(-1px)}
.opt[aria-pressed=true]{border-color:var(--ink);background:var(--hl-soft);box-shadow:inset 6px 0 0 var(--ink)}
.load{padding:18px;border:2px dashed var(--muted);border-radius:12px;text-align:center;font-family:var(--f-type);font-weight:700;margin:16px 0}

/* Rückmeldung wie ein Stempel auf dem Blatt */
.fb{position:relative;border:2px solid var(--ok);border-radius:10px;padding:12px 16px;margin:16px 0 8px;background:var(--ok-soft)}
.fb.near{border-color:var(--folder-edge);background:var(--hl-soft)}
.fb.no{border-color:var(--bad);background:var(--bad-soft)}
.fb strong{display:block;font-family:var(--f-display);font-size:26px;line-height:1.15;padding-right:0}
.fb .stp{position:absolute;right:12px;top:-14px;background:var(--paper);border:3px solid var(--ok);color:var(--ok);font-family:var(--f-type);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding:1px 8px;border-radius:4px;transform:rotate(4deg)}
.fb:focus{outline:none}
.fb.info{background:#fff;border-color:var(--ink)}
.rot{color:#d62828;font-weight:700}.blau{color:#1d4ed8;font-weight:700}
.auftrag{border:2px solid var(--ink);border-radius:10px;padding:6px 16px 14px;background:#fff;margin:14px 0}
.auftrag ol{margin:6px 0 10px;padding-left:24px;display:flex;flex-direction:column;gap:8px;font-size:1.05rem}
.chk{display:flex;align-items:center;gap:12px;padding:10px 14px;border:2px solid var(--rule);border-radius:10px;background:var(--desk);margin:8px 0;cursor:pointer;font-weight:700;min-height:54px}
.chk input{width:28px;height:28px;flex:none;accent-color:var(--ink);margin:0}
.chk:has(input:checked){background:var(--ok-soft);border-color:var(--ok)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.explore{border:1px dashed var(--muted);border-radius:10px;padding:6px 14px;margin:16px 0}
.orte{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0}
.ort{border:2px solid var(--ink);border-radius:10px;padding:10px 6px;text-align:center;background:#fff;display:flex;flex-direction:column;gap:2px}
.ort b{font-family:var(--f-display);font-size:1.25rem}
.ort small{color:var(--muted);font-family:var(--f-type);font-size:12px}
.ort .t{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,5vw,34px);line-height:1.2}
.day.a{border-top:8px solid #d62828}.day.b{border-top:8px solid #1d4ed8}
.day.win.a{border-top-color:#d62828}.day.win.b{border-top-color:#1d4ed8}

@media (prefers-reduced-motion:no-preference){.fb{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.97);opacity:.4}}}
.fail{border:2px solid var(--bad);border-radius:10px;padding:12px 16px;background:var(--bad-soft);margin:16px 0}
.btn{min-height:50px;padding:10px 20px;border:0;border-radius:10px;background:var(--ink);color:var(--paper);font-weight:700}
.btn:hover{filter:brightness(1.2)}
.btn.light{background:var(--paper);color:var(--ink);border:2px solid var(--rule)}
.btn.light:hover{border-color:var(--ink);filter:none}
.fig{border:1px solid var(--rule);border-radius:10px;padding:8px;margin:12px 0;background:#fff}
.fig svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:4px 0 0;font-weight:700;font-size:.95rem}
.legend i{display:inline-block;width:26px;height:0;border-top:5px solid #d62828;vertical-align:middle;margin-right:6px;border-radius:3px}
.legend i.b{border-top:5px dashed #1d4ed8}
.cells{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.cell{min-width:68px;flex:1 1 68px;text-align:center;border:1px solid var(--folder-edge);border-radius:8px;padding:4px 6px;background:var(--folder)}
.cell span{display:block;font-family:var(--f-type);font-size:12px;color:var(--muted)}
.cell b{font-family:var(--f-type);font-size:1.25rem}
.tabs{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px;margin:6px 0;font-family:var(--f-type)}
th,td{border:1px solid var(--folder-edge);padding:6px;text-align:center}
th{background:var(--folder);font-size:.85rem}
td.l{text-align:left;font-weight:700;white-space:nowrap;background:var(--paper)}
.two-days{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.day{border:2px solid var(--rule);border-radius:10px;padding:10px 12px;text-align:center;background:var(--paper)}
.day.win{background:var(--hl-soft);border-color:var(--ink)}
.day h4{margin:0;font-family:var(--f-type);font-size:.95rem}
.day .big{font-family:var(--f-display);font-size:2.1rem;font-weight:700;line-height:1.2}
.day small{display:block;color:var(--muted);font-size:.9rem}
.note{border:2px dashed var(--muted);border-radius:10px;background:#fffdf2;padding:12px 16px;margin:18px 0;font-family:var(--f-type);font-size:1.02rem}
.note>b:first-child{display:block;margin-bottom:4px;font-family:var(--f-display);font-size:1.3rem}
.note p{margin:6px 0;line-height:1.7}
.tagb{display:inline-block;background:var(--hl-soft);border:2px solid var(--ink);border-radius:8px;padding:6px 14px;margin:6px 0;font-size:1.1rem}
.kap{position:relative;background:#fffdf2;border:2px solid var(--folder-edge);border-left:8px solid var(--ink);border-radius:4px 12px 12px 4px;padding:20px clamp(14px,3vw,22px) 12px;margin:30px 0 18px}
.kaptag{position:absolute;right:12px;top:-14px;background:var(--ink);color:var(--paper);font-family:var(--f-type);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding:2px 10px;border-radius:4px}
.kap .kaph{font-family:var(--f-display);font-size:1.4rem;letter-spacing:0;text-transform:none;color:var(--ink);margin:0 0 6px}
.kap p{margin:8px 0;line-height:1.7;font-size:1.05rem}
.need{background:var(--paper);border:1px solid var(--folder-edge);border-radius:10px;padding:10px 16px;align-self:stretch}.need ul{margin:6px 0 2px 20px;padding:0}.need li{margin:5px 0;line-height:1.5}
.beweis{position:relative;background:var(--paper);border:2px solid var(--folder-edge);border-left:8px solid var(--stamp);border-radius:4px 12px 12px 4px;padding:20px clamp(14px,3vw,22px) 14px;margin:14px 0 20px}
.bwtag{position:absolute;right:12px;top:-14px;background:var(--paper);border:3px solid var(--stamp);color:var(--stamp);font-family:var(--f-type);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding:1px 8px;border-radius:4px;transform:rotate(-2deg)}
.beweis .bwh{font-family:var(--f-display);font-size:1.4rem;letter-spacing:0;text-transform:none;color:var(--ink);margin:0 0 6px}
.beweis p{margin:8px 0;line-height:1.7;font-size:1.05rem}
.beweis .quelle{font-size:.95rem;margin:12px 0 0;color:var(--muted)}.beweis .quelle a{color:var(--ink);font-weight:700}
.merk{background:var(--hl-soft);border-radius:8px;padding:8px 14px;margin-top:12px}
.merk ul{margin:4px 0 2px 18px;padding:0}.merk li{margin:3px 0;line-height:1.5}
.spur{border:2px dashed var(--muted);border-radius:10px;background:#fff;padding:6px 16px;margin:10px 0}
.spur p{margin:8px 0;line-height:1.6}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--ink);text-align:center;padding:0 6px;font-weight:700}
.think{border-left:6px solid var(--stamp);padding:4px 12px;margin:12px 0;font-family:var(--f-display);font-size:1.3rem;font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 4px}
#map{height:320px;border:1px solid var(--rule);border-radius:10px;margin:8px 0}
.leaflet-tooltip.lbl{font-family:var(--f-body);font-weight:700;font-size:15px;color:#14211f;border:2px solid #14211f;border-radius:8px;text-transform:none;letter-spacing:0}
details{margin:10px 0}
tr.dim td{color:var(--muted)}
summary{cursor:pointer;font-weight:700;min-height:36px}
footer{max-width:1000px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:.85rem;font-family:var(--f-type)}
footer a{color:inherit}
@media (max-width:520px){body{font-size:17px}.two-days{grid-template-columns:1fr}}

/* FreiDay-Einsätze */
.cover::before{content:"Logbuch 4b"!important}
.todo{margin:8px 0 12px 22px;padding:0}.todo li{margin:6px 0;line-height:1.55}
.klx{display:inline-block;background:var(--ink);color:var(--paper)!important;text-decoration:none;font-weight:700;padding:8px 14px;border-radius:8px;margin:4px 0}
.rollen{display:grid;gap:14px;margin:12px 0}
.rolle{position:relative;border:2px solid var(--ink);border-radius:10px;padding:12px 16px 8px 64px;background:#fff}
.rbadge{position:absolute;left:14px;top:12px;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:1.3rem}
.fr{margin:6px 0 4px 20px;padding:0}.fr li{margin:5px 0}
.vier{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
@media(max-width:560px){.vier{grid-template-columns:1fr}}
.v4{border:2px solid var(--ink);border-radius:10px;padding:8px 14px;background:#fff}.v4 b{font-family:var(--f-display);font-size:1.4rem;display:block}.v4 small{display:block;font-family:var(--f-type);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ideen{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
@media(max-width:560px){.ideen{grid-template-columns:1fr}}
.idee{position:relative;border:2px dashed var(--muted);border-radius:10px;padding:10px 14px 6px 64px;background:#fff}
.note.warn{border-color:var(--stamp);background:#fdf0ee}
.sdgchip{display:flex;align-items:center;gap:8px;font-family:var(--f-type);font-weight:700;font-size:.9rem}.sdgchip i{display:inline-block;width:14px;height:14px;border-radius:3px}

/* FreiDay-Look: grün und sonnengelb, runde Formen, Handschrift für Titel (passend zur Startseite) */
:root{--desk:#eaf3ec;--folder:#def0e2;--folder-edge:#8fc4a0;--paper:#fff;--ink:#10301d;--muted:#4d6657;--rule:#cfe0d4;--stamp:#2c7a4b;--ok:#2c7a4b;--ok-soft:#def0e2;--hl:#f2c14e;--hl-soft:#fbe9b4;--blue:#1f6fb5;--green:#2c7a4b;--sun:#f2c14e;
 --f-display:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;--f-type:var(--f-display);--f-hand:"Caveat","Atkinson Hyperlegible",cursive}
.lbl,.chip small,.opt small,.cell span,.ort small,.now small,.v4 small,.gbar .ttl small,.steps li,footer{font-family:var(--f-body)}
.cover{background:#fff;border:2px solid var(--green);border-radius:10px 10px 44px 10px;overflow:visible}
.cover::before{background:var(--green)!important;color:#fff!important;border:0!important;border-radius:10px 10px 0 0!important;font-family:var(--f-body)!important;font-weight:700;letter-spacing:.04em}
.cover h1{font-family:var(--f-hand);font-size:clamp(48px,9vw,84px);line-height:.95;letter-spacing:0;color:var(--green)}
.cover h1 span{font-family:var(--f-body);color:var(--ink);font-size:.26em;letter-spacing:.12em}
.sun{position:absolute;right:clamp(14px,4vw,40px);top:20px;background:var(--sun);color:#2a2000;border:3px solid var(--green);border-radius:50%;width:112px;height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:14px;line-height:1.15;transform:rotate(8deg);padding:8px}
.sun b{font-family:var(--f-hand);font-size:34px;line-height:1}
@media (max-width:620px){.sun{position:static;align-self:flex-start;transform:rotate(-4deg)}}
.now,.need{background:var(--folder);border-color:var(--folder-edge)}
.file{background:#fff;border:2px solid var(--green);border-radius:10px 10px 30px 10px}
.file .tab{background:var(--green);color:#fff;border:0;font-family:var(--f-body);letter-spacing:.04em}
.file h3{font-family:var(--f-hand);font-size:36px;line-height:1;color:var(--green)}
.file p{color:var(--ink)}
.stars{color:var(--folder-edge)}.stars.on{color:#e0a100}
.solvedst{border-color:var(--green);color:var(--green);font-family:var(--f-body)}
.open,.btn{background:var(--sun);color:#2a2000;border:2px solid var(--green);border-radius:14px 14px 14px 4px}
.btn.light{background:#fff;color:var(--ink);border:2px solid var(--green)}
.open:hover,.btn:hover{filter:none;background:#f7d27a}
.gbar{background:var(--green);border-color:var(--green);color:#fff;border-radius:10px 10px 30px 10px}
.gbar .ttl{font-family:var(--f-hand);font-size:36px}.gbar .ttl small{color:#d8efdf}
.back{background:#fff;border:2px solid var(--sun);color:var(--ink);border-radius:12px}
.qcard{border-radius:10px 10px 36px 10px;border:2px solid var(--folder-edge)}
h3{font-family:var(--f-body)}
.steps li.on::before{background:var(--sun);outline:2px solid var(--green)}.steps li.done::before{background:var(--green)}
.chip[aria-pressed=true],.opt[aria-pressed=true]{border-color:var(--green)}
.kap{background:#f4faf5;border:2px solid var(--folder-edge);border-left:8px solid var(--sun);border-radius:4px 14px 14px 4px}
.kaptag{background:var(--green);font-family:var(--f-body);transform:none}
.kap .kaph,.beweis .bwh{font-family:var(--f-hand);font-size:2rem;line-height:1.1;color:var(--green)}
.kap p{font-size:1.1rem}
.auftrag{border-color:var(--green);border-radius:14px 14px 14px 4px;background:#fff}
.chk:has(input:checked){background:var(--ok-soft);border-color:var(--green)}.chk input{accent-color:var(--green)}
.klx{background:var(--green)}
.rolle,.v4{border-color:var(--green);background:#fff}.rbadge{background:var(--green);font-family:var(--f-hand);font-size:1.7rem}
.v4 b{font-family:var(--f-hand);font-size:1.9rem;color:var(--green)}
.idee{border-color:var(--folder-edge);background:#fff}
.beweis{border-color:var(--folder-edge);border-left:8px solid var(--green)}
.bwtag{border-color:var(--green);color:var(--green);font-family:var(--f-body);transform:none}
.fb{border-color:var(--green);background:var(--ok-soft)}.fb .stp{border-color:var(--green);color:var(--green);font-family:var(--f-body)}.fb strong{font-family:var(--f-hand);font-size:2rem;color:var(--green)}
.note.warn{border-color:#c9661a;background:#fdf1e3}
.merk{background:var(--hl-soft)}
.note{background:#fffdf2}
.note>b:first-child{font-family:var(--f-body)}

.homelink{max-width:1000px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.homelink a{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:6px 16px;border-radius:99px;background:#fff;color:var(--ink);border:2px solid var(--ink);font-weight:700;font-size:16px;text-decoration:none}
.homelink a:hover{background:var(--ink);color:#fff}
.homelink a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.foto{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff8e6;border:2px dashed var(--folder-edge);border-radius:14px;padding:14px;margin:12px 0}
.foto .fe{font-size:72px;line-height:1}.foto .fl{font-size:28px;letter-spacing:6px}.foto small{color:var(--muted)}
.tipps{margin:10px 0}.tipps .muted{margin:0 0 6px;font-size:.95rem}
.chk.self{background:#fffdf2;border-style:dashed}
.loesung{background:#f4faf5;border:2px solid var(--green);border-radius:12px;padding:10px 14px;margin:8px 0 12px}
.loesung .lbl{display:inline-block;background:var(--green);color:#fff;font-weight:700;font-size:.85rem;padding:2px 10px;border-radius:99px;margin-bottom:6px}
.loesung p{margin:4px 0}
</style>

</head>
<body>
<nav class="homelink" aria-label="Zur Startseite"><a href="/">‹ Lernwerkstatt 4b (Startseite)</a></nav>
<main id="app" aria-live="polite"></main>
<script>
/* FreiDay-Einsätze: Geschichte der 4b mit SDG-Bezug. Pro Team ein Einsatz, fünf Etappen, Klexikon als Recherche. */
const KLX=t=>`<a class="klx" href="https://klexikon.zum.de/wiki/${encodeURIComponent(t)}" target="_blank" rel="noopener">Klexikon: ${t} ↗</a>`;
const EINS={
 igel:{nr:1,t:'Der Igel-Einsatz',frage:'Wie können wir Igeln durch den Winter helfen?',sdg:15,sdgn:'Leben an Land',sdgt:'Wir schützen Tiere und ihren Lebensraum an Land.',
  zeit:['Fr 20.11.','Fr 20.11.','Fr 27.11.','Fr 4.12.','Fr 11.12.','Fr 18.12.'],
  kap:[
   {t:'Der Hilferuf',p:['Mitte November. Der erste Frost kommt. In der grossen Pause ruft ein Kind der 4b: «Kommt schnell! Im Laub liegt ein Igel!» Alle rennen hin. Der Igel ist klein und dünn. Ein Nest sehen die Kinder nirgends.',
     '«Was ist mit ihm los?», fragt ein Kind. «Was braucht er jetzt?», fragt ein anderes. «Und wie können wir helfen?» Alle reden durcheinander.',
     'Da sagt jemand: «Stopp. Zuerst schauen wir genau hin. Dann sammeln wir, was wir vermuten.»']},
   {t:'Forschen',p:['Die Teams wollen es genau wissen. Aber niemand ist Igel-Experte. «Wo finden wir die Antworten?», fragt ein Kind. «Im Klexikon!», ruft ein anderes.','Es gibt nur ein Tablet pro Team. Darum forschen die Teams in drei Runden. In jeder Runde sucht ein anderes Kind. Die anderen lesen mit.']},
   {t:'Der Plan',p:['Jetzt wissen die Teams viel mehr. «Der Igel will im Winter schlafen», sagt ein Kind. «Aber wie können wir ihm dabei helfen?»','Die Teams überlegen, probieren Ideen aus und entscheiden sich. Sie schreiben auf, was sie tun wollen und wer was macht.']},
   {t:'Das Umsetzen',p:['Der Plan steht. Die Teams ziehen Handschuhe an und legen los. Aber vorher fragt ein Kind: «Dürfen wir das hier überhaupt? Und liegt hier nicht schon ein Nest?»','«Leise», flüstert ein anderes Kind. «Ein Igel braucht Ruhe.» Am Ende macht die Lehrperson ein Foto.']},
   {t:'Das Prüfen',p:['Das Werk ist fertig. Aber ist es auch gut? «Woran merken wir das?», fragt ein Kind. Die Teams überlegen sich Prüffragen. Dann schaut ein anderes Team oder ein Gast genau hin.','Manche Teams merken: Hier können wir noch etwas besser machen.']},
   {t:'Der Bericht',p:['Die letzte Etappe. Jedes Team zeigt der Klasse, was es gefragt, herausgefunden, gemacht und geprüft hat. Alle staunen, wie viel die 4b in fünf Wochen geschafft hat.','Der Igel hat Hilfe bekommen. Und die Welt ist ein Stück besser.']}],
  felder:[
   {k:'A',t:'Essen',lk:'Igel',auftrag:'Finde heraus: <b>Was frisst ein Igel? Und warum ist das im Herbst besonders wichtig?</b>',
    tipp:['Was braucht ein Tier, wenn es lange nichts fressen kann?','Suche im Klexikon bei <b>Igel</b> den Abschnitt zum Fressen.','Suche diese Wörter: <b>Insekten</b>, <b>Fettpolster</b>.'],
    loesung:'Ein Igel frisst vor allem Insekten (Käfer, Raupen, Ameisen). Auch Regenwürmer und Schnecken. Im Herbst frisst er sich ein Fettpolster an. Im Winter findet er kaum Futter.'},
   {k:'B',t:'Schlafen',lk:'Winterschlaf',auftrag:'Finde heraus: <b>Wo schläft ein Igel im Winter? Was passiert dabei in seinem Körper?</b>',
    tipp:['Was würdest du als Tier tun, wenn es kalt ist und kein Futter gibt?','Suche im Klexikon bei <b>Winterschlaf</b> und bei <b>Igel</b>.','Suche diese Wörter: <b>Nest</b>, <b>Körpertemperatur</b>, <b>Herzschlag</b>.'],
    loesung:'Der Igel schläft in einem Nest aus Laub und Ästen. Im Winterschlaf sinkt seine Körpertemperatur. Atmung und Herzschlag werden langsamer. So braucht er kaum Energie.'},
   {k:'C',t:'Helfen',lk:'Igel',nabu:true,auftrag:'Finde heraus: <b>Wo suchen Igel im Winter einen Schlafplatz? Wie kann man ihnen helfen?</b>',
    tipp:['Wo würdest du dich als Igel im Winter verstecken: im Freien, geschützt vor Wind und Regen?','Suche im Klexikon bei <b>Igel</b> den Abschnitt «Soll man Igel füttern?». Profis lesen auch die NABU-Seite unten.','Suche diese Wörter: <b>Hecke</b>, <b>Reisig</b>, <b>Laub</b>, <b>Totholz</b>, <b>naturnaher Garten</b>.'],
    loesung:'Igel schlafen in Erdmulden, unter Hecken und in Haufen aus Totholz, Reisig und Laub. Am besten hilft ein naturnaher Garten mit Laub, Reisig und Verstecken. Füttern nur wenn nötig, und dann nur Katzenfutter.'}],
  satz:{loesung:'Ein Igel schläft im Winter in einem <b>Nest aus Laub, Totholz und Reisig</b>, in einer ruhigen, geschützten Ecke. Dafür brauchen wir <b>Laub, Totholz und Reisig</b> und einen <b>ruhigen Ort</b>.'},
  plan:{tipp:['Wo schlafen Igel in der Natur? Das habt ihr in Etappe 2 herausgefunden. Wie könnt ihr so einen Ort schaffen? Und wie könnt ihr anderen zeigen, wie man Igeln hilft?','Lies in deinem Logbuch nach, was du bei «Helfen» und «Schlafen» herausgefunden hast.','Denke an: <b>Laub</b>, <b>Totholz</b>, <b>Reisig</b>. Und an etwas zum <b>Verteilen</b> oder <b>Aufhängen</b>.'],
   loesung:'Mögliche Ideen: <b>Laubhaufen</b> in einer ruhigen Ecke. <b>Totholzstapel</b> oder Reisighaufen. <b>Infomaterial</b> (Flyer, Plakat, Schild «Hier schlafen vielleicht Igel»). Es darf auch nur eines davon sein. Ihr könnt auch zwei kombinieren.'},
  pruef:{tipp:['Denke an den Igel: Was braucht er? Denke an die Leserinnen und Leser: Was sollen sie danach wissen oder tun?','Schreibe die Fragen so, dass man mit Ja oder Nein antworten kann.','Beispiel zum Anfangen: «Ist der Ort ruhig?» oder «Versteht es ein Kind aus der 2. Klasse?»'],
   loesung:'<b>Haufen:</b> Ist der Ort ruhig und geschützt (zum Beispiel bei einer Hecke)? Liegen Totholz, Reisig und Laub darin? Weiss der Hauswart Bescheid? Haben wir vorher nachgesehen, dass dort kein Nest liegt?<br><b>Infomaterial:</b> Versteht es ein Kind aus der 2. Klasse? Steht darin, was man für Igel tun kann? Stimmt jeder Satz? Wissen wir, woher wir es haben (Quelle)?'},
  bericht:{loesung:'<b>Das haben wir herausgefunden:</b> Igel halten Winterschlaf. Dafür brauchen sie im Herbst ein Fettpolster und im Winter ein trockenes, ruhiges Versteck. Igel schlafen in Erdmulden, unter Hecken und in Haufen aus Totholz, Reisig und Laub. Einen Unterschlupf soll man im Winter nicht mehr versetzen.'},
  merk:['Igel halten Winterschlaf. Dafür brauchen sie im Herbst ein Fettpolster und ein ruhiges Versteck.','Igel schlafen in Erdmulden, unter Hecken und in Haufen aus Totholz, Reisig und Laub.','Einen Unterschlupf soll man im Winter nicht mehr versetzen. Füttern nur wenn nötig, nur Katzenfutter.'],
  quellen:[['Klexikon: Igel','https://klexikon.zum.de/wiki/Igel'],['Klexikon: Winterschlaf','https://klexikon.zum.de/wiki/Winterschlaf'],['NABU: Unterschlupf für Igel im Winter','https://www.nabu.de/aktiv-werden/naturnah-gaertnern/tiere-im-garten/winterquartiere/unterschlupf-fuer-igel-im-winter']]}
};
const N=2; /* sichtbare Etappen: pro Freitag eine mehr (Etappe 3 ab Fr 27.11. usw.) */
const ET=['Hilferuf','Forschen','Plan','Umsetzen','Prüfen','Bericht'].slice(0,N);
const CK={1:'Wir haben unsere Vermutung ins Logbuch geschrieben.',2:'Wir haben alle drei Runden gemacht und den Satz geschrieben.',3:'Die Lehrperson hat unseren Plan angeschaut.',4:'Wir haben unser Werk gemacht und ein Foto bekommen.',5:'Wir haben unser Werk geprüft und etwas verbessert.',6:'Wir haben der Klasse berichtet.'};
let ST={};try{ST=JSON.parse(localStorage.getItem('fd_einsatz')||'{}')||{}}catch(e){}
const save=()=>{try{localStorage.setItem('fd_einsatz',JSON.stringify(ST))}catch(e){}};
const S={view:'home',open:{}};
const done=(id,n)=>!!(ST[id]&&ST[id]['c'+n]);
const cur=id=>{for(let n=1;n<=N;n++)if(!done(id,n))return n;return N+1};
const kap=(id,n)=>{const k=EINS[id].kap[n-1],z=EINS[id].zeit[n-1];return `<div class="kap"><span class="kaptag">Kapitel ${n} · ${z}</span><h3 class="kaph">${k.t}</h3>${k.p.map(x=>`<p>${x}</p>`).join('')}</div>`};
const ol=l=>`<ol class="todo">${l.map(x=>`<li>${x}</li>`).join('')}</ol>`;
const box=(t,inner)=>`<div class="auftrag"><h3>${t}</h3>${inner}</div>`;
const chk=(id,n,locked)=>`<label class="chk"><input type="checkbox" data-act="chk" data-id="${id}" data-n="${n}" ${done(id,n)?'checked':''} ${locked?'disabled':''}><span>${CK[n]}</span></label>`;
const stepper=(id)=>{const c=cur(id);return `<ol class="steps" aria-label="Etappen">`+ET.map((t,i)=>`<li class="${i+1===c?'on':i+1<c?'done':''}"><i>${i+1}</i>${t}</li>`).join('')+`</ol>`};
const details=(key,sum,inner)=>`<details class="explore" data-k="${key}" ${S.open[key]?'open':''}><summary>${sum}</summary>${inner}</details>`;
/* Hilfe-Treppe: Tipp 1 (Gegenfrage), Tipp 2 (wo suchen), Tipp 3 (fast die Antwort). */
const tipps=(key,t)=>`<div class="tipps"><p class="muted">Brauchst du Hilfe? Öffne die Tipps der Reihe nach.</p>`+t.map((x,i)=>details('t'+key+i,'Tipp '+(i+1),`<p>${x}</p>`)).join('')+`</div>`;
/* Selbstkontrolle: Lösungs-Logbuch erst nach der eigenen Antwort. */
const selbst=(id,key,loesung,text)=>{const on=!!(ST[id]&&ST[id]['s'+key]);return `<label class="chk self"><input type="checkbox" data-act="self" data-id="${id}" data-key="${key}" ${on?'checked':''}><span>${text||'Ich habe meine eigene Antwort ins Logbuch geschrieben.'}</span></label>`+(on?`<div class="loesung"><span class="lbl">Lösungs-Logbuch</span><p>${loesung}</p><p class="muted">Vergleiche mit deiner Antwort. Ergänze, was dir noch fehlt, in einer anderen Farbe.</p></div>`:'')};

function viewHome(){
 const n=Object.keys(EINS).filter(id=>done(id,N)).length;
 return `<section class="cover"><div class="sun" aria-hidden="true"><b>Wir</b>verbessern<br>die Welt</div>
 <h1><span>Logbuch der 4b</span>FreiDay-Einsätze</h1>
 <p>Die 4b macht sich auf den Weg und verbessert die Welt. Euer Team übernimmt einen Einsatz. Ihr geht Etappe für Etappe vor. Jeden Freitag kommt eine neue Etappe dazu. Die Antworten findet ihr selbst.</p>
 <div class="need"><b>Das braucht euer Team:</b><ul><li><b>Euer Einsatz-Logbuch</b> (Papier): Eines pro Team. Dort schreibt ihr.</li><li><b>Diese App:</b> Geschichte, Forschungsaufträge, Klexikon-Links und Tipps.</li></ul></div></section>
 <div class="files">${Object.entries(EINS).map(([id,e])=>`<div class="file"><span class="tab">Einsatz 0${e.nr}</span><h3>${e.t}</h3><p>${e.frage}</p><p class="sdgchip"><i style="background:#56c02b"></i>SDG ${e.sdg} · ${e.sdgn}</p><div class="foot"><span class="stars ${done(id,N)?'on':''}" aria-label="${done(id,N)?'geschafft':'offen'}">${done(id,N)?'★':'☆'}</span><button class="open" data-act="open" data-v="${id}">Einsatz öffnen</button></div>${done(id,N)?'<span class="solvedst">FR 20.11. GESCHAFFT</span>':''}</div>`).join('')}</div>
 <p class="muted" style="margin-top:22px">Mehr Einsätze folgen. Quelle für die Recherche: <a href="https://klexikon.zum.de" target="_blank" rel="noopener">Klexikon</a>.</p>`}

function viewEinsatz(id){
 const e=EINS[id],c=cur(id);let h=`<div class="gbar"><button class="back" data-act="home">← Alle Einsätze</button><div class="ttl"><small>Einsatz 0${e.nr} · SDG ${e.sdg}: ${e.sdgn}</small>${e.t}</div></div><div class="qcard">`+stepper(id);
 /* 1 Hilferuf (Fr 20.11.) */
 h+=kap(id,1)+`<div class="foto" role="img" aria-label="Zeichnung: ein kleiner, dünner Igel im Laub"><span class="fe">🦔</span><span class="fl">🍂 🍂 🍂</span><small>Der Igel aus der Pause (Zeichnung)</small></div>`+
  box('1 · Hilferuf',ol(['Schaut das Bild genau an.','Öffnet euer <b>Einsatz-Logbuch</b> (Papier) bei <b>Blatt 1</b>, Etappe 1.','Schreibt auf: <b>Das sehen wir.</b> (2 Dinge)','Schreibt auf: <b>Das vermuten wir:</b> Was könnte im Winter mit dem Igel passieren?','Nehmt die <b>SDG-Karten</b>. Welche Karte passt zu diesem Einsatz? Legt sie auf den Tisch. Schreibt die Nummer ins Logbuch und schreibt: <b>Darum.</b>'])+
  selbst(id,'sdg','Die Karte <b>SDG 15: Leben an Land</b> passt am besten: Wir schützen Tiere und ihren Lebensraum an Land. Auch SDG 13 (Klimaschutz) kann passen, wenn ihr es gut begründet habt.','Wir haben die Karte und den Grund aufgeschrieben.')+chk(id,1));
 /* 2 Forschen (Fr 20.11.) */
 if(c>=2){h+=kap(id,2)+box('2 · Forschen',ol(['Ihr habt <b>ein Tablet</b> pro Team. Ihr forscht in <b>drei Runden</b>: Runde 1 ist Feld A, Runde 2 ist Feld B, Runde 3 ist Feld C.','In jeder Runde hat <b>ein Kind</b> das Tablet und sucht im <a class="klx" href="https://klexikon.zum.de/wiki/Spezial:Suche" target="_blank" rel="noopener">Klexikon ↗</a>. Es wählt selbst die Suchwörter. Die <b>zwei anderen</b> lesen mit und sagen: «Stopp, das ist es!»','Alle drei schreiben die Antwort in ihr Logbuch (Blatt 1, Etappe 2). Schreibt auch das Suchwort auf.','Dann gebt ihr das Tablet weiter. Das nächste Kind sucht.','Am Schluss füllt ihr zusammen den <b>Satz</b> im Logbuch aus.'])+
   `<div class="rollen">`+e.felder.map((r,i)=>`<div class="rolle"><span class="rbadge">${r.k}</span><b>Runde ${i+1} · ${r.t}</b><p>${r.auftrag}</p>${tipps('f'+r.k,r.tipp)}${r.nabu?`<p><a class="klx" href="${e.quellen[2][1]}" target="_blank" rel="noopener">Profi-Quelle: NABU ↗</a></p>`:''}${selbst(id,'f'+r.k,r.loesung,'Wir haben unsere Antwort ins Logbuch geschrieben.')}</div>`).join('')+`</div>`+
   `<div class="auftrag"><h3>Unser Satz</h3><p>Schreibt in euer Logbuch und ergänzt:</p><p><b>Ein Igel schläft im Winter in ______. Dafür brauchen wir ______.</b></p></div>`+
   selbst(id,'fz',e.satz.loesung,'Wir haben den Satz im Logbuch ergänzt.')+chk(id,2,c<2))}
 if(c>N)h+=`<div class="fb"><span class="stp">Geschafft</span><strong>Für heute geschafft!</strong><p>Die nächste Etappe kommt am nächsten Freitag.</p></div>`;
 h+=`<div class="actions"><button class="btn" data-act="home">Zurück zu allen Einsätzen</button><button class="btn light" data-act="again" data-v="${id}">Nochmals von vorn</button></div></div>`;
 return h}
function render(){$('#app').innerHTML=S.view==='home'?viewHome():viewEinsatz(S.view)}
const $=s=>document.querySelector(s);
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT')return;const a=b.dataset.act,v=b.dataset.v;
 if(a==='home'){S.view='home';render();scrollTo(0,0)}
 else if(a==='open'){S.view=v;render();scrollTo(0,0)}
 else if(a==='again'){delete ST[v];save();S.open={};render();scrollTo(0,0)}});
document.addEventListener('change',e=>{const i=e.target;if(i.dataset.act==='self'){const id=i.dataset.id;ST[id]=ST[id]||{};if(i.checked)ST[id]['s'+i.dataset.key]=true;else delete ST[id]['s'+i.dataset.key];save();render();return}if(i.dataset.act!=='chk')return;const id=i.dataset.id,n=+i.dataset.n;ST[id]=ST[id]||{};
 if(i.checked)ST[id]['c'+n]=true;else for(let k=n;k<=N;k++)delete ST[id]['c'+k];save();render();
 const nx=document.querySelector('.kap:last-of-type');if(i.checked&&n<N){const k=document.querySelectorAll('.kap');const last=k[k.length-1];if(last)try{last.scrollIntoView({behavior:'smooth',block:'start'})}catch(x){}}});
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.classList&&d.classList.contains('explore'))S.open[d.dataset.k]=d.open},true);
render();
</script>
</body>
</html>
