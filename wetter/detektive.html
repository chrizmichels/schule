<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Klimadetektive 4b</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap">
<style>
/* Klimadetektive: kindgerechte Version der Wetter-Anzeige. Ein Fall = eine Frage. Erst vermuten, dann die Spur (Messwerte) prüfen, dann ins Heft schreiben. */
:root{--teal:#28c6a4;--ink:#14211f;--lav:#d8e1f9;--grey:#f0f2f2;--warm:#ffe3a3;--ok:#d3f5ea;--near:#fff0c2;--no:#fde3d8;--muted:#44544f;--a:#0e8a72;--b:#d9780a;
 --font:'Andika','Trebuchet MS',Verdana,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html{font-size:18px;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);color:var(--ink);background:#fff;line-height:1.4;font-size:1.05rem}
.band{background:var(--teal);border-bottom:3px solid var(--ink);padding:12px 16px}
.band .in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:12px}
.band svg{flex:none}
.band h1{margin:0;font-size:1.55rem;line-height:1.1}
.band p{margin:2px 0 0;font-size:.95rem}
main{max-width:860px;margin:0 auto;padding:16px 16px 48px}
h2{font-size:1.35rem;margin:18px 0 8px;line-height:1.2}
h3{font-size:1.1rem;margin:16px 0 6px}
p{margin:6px 0}
.muted{color:var(--muted);font-size:.9rem}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:4px solid #5b6cff;outline-offset:2px}
.now{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;background:var(--grey);border:2px solid var(--ink);border-radius:14px;padding:10px 14px;margin:6px 0 14px}
.now b{font-size:1.5rem}
.now small{color:var(--muted)}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px;padding:0;list-style:none}
.steps li{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:999px;padding:4px 12px 4px 4px;background:#fff;font-size:.9rem;font-weight:700}
.steps li i{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--grey);border:2px solid var(--ink);font-style:normal}
.steps li.on{background:var(--teal)}
.steps li.on i{background:#fff}
.steps li.done i{background:var(--ink);color:#fff}
.cards{display:grid;gap:12px;margin:10px 0}
.card{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:12px 16px;border:3px solid var(--ink);border-radius:18px;background:#fff;text-align:left;cursor:pointer}
.card:hover{background:var(--lav)}
.card .n{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--teal);border:3px solid var(--ink);font-weight:700;font-size:1.3rem}
.card.solved .n{background:var(--warm)}
.card b{display:block;font-size:1.2rem}
.card span{color:var(--muted);font-size:.95rem}
.card .star{margin-left:auto;font-size:1.6rem}
.back{border:0;background:none;padding:8px 0;font-weight:700;cursor:pointer;text-decoration:underline;font-size:1rem;min-height:44px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.chip{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:50px;padding:6px 14px;border:3px solid var(--ink);border-radius:14px;background:#fff;cursor:pointer;font-weight:700;line-height:1.15}
.chip small{font-weight:400;font-size:.78rem;color:var(--muted)}
.chip:hover:not(:disabled){background:var(--lav)}
.chip[aria-pressed=true]{background:var(--teal)}
.chip[aria-pressed=true] small{color:var(--ink)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.chips input[type=date]{font:inherit;min-height:50px;border:3px solid var(--ink);border-radius:14px;padding:4px 10px;background:#fff}
.opts{display:grid;gap:10px;margin:8px 0}
.opts.two{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 16px;border:3px solid var(--ink);border-radius:16px;background:#fff;text-align:left;cursor:pointer;font-weight:700;font-size:1.1rem}
.opt small{display:block;font-weight:400;font-size:.85rem;color:var(--muted)}
.opt:hover{background:var(--lav)}
.opt[aria-pressed=true]{background:var(--teal)}
.opt[aria-pressed=true] small{color:var(--ink)}
.opt svg{flex:none}
.q{font-size:1.25rem;font-weight:700;margin:14px 0 4px}
.load{padding:18px;border:3px dashed var(--ink);border-radius:16px;text-align:center;font-weight:700;margin:14px 0}
.fb{border:3px solid var(--ink);border-radius:16px;padding:12px 16px;margin:14px 0 8px;background:var(--ok)}
.fb.near{background:var(--near)}
.fb.no{background:var(--no)}
.fb strong{display:block;font-size:1.25rem}
.fb:focus{outline:none}
.fail{border:3px solid var(--ink);border-radius:16px;padding:12px 16px;background:var(--no);margin:14px 0}
.btn{min-height:50px;padding:8px 20px;border:3px solid var(--ink);border-radius:14px;background:var(--teal);font-weight:700;cursor:pointer;font-size:1.05rem}
.btn:hover{background:#4dd9ba}
.btn.light{background:#fff}
.btn.light:hover{background:var(--lav)}
.fig{border:2px solid var(--ink);border-radius:14px;padding:8px;margin:10px 0;background:#fff}
.fig svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:4px 0 0;font-weight:700;font-size:.95rem}
.legend i{display:inline-block;width:26px;height:0;border-top:5px solid var(--a);vertical-align:middle;margin-right:6px;border-radius:3px}
.legend i.b{border-top:5px dashed var(--b)}
.cells{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.cell{min-width:68px;flex:1 1 68px;text-align:center;border:2px solid var(--ink);border-radius:12px;padding:4px 6px;background:var(--grey)}
.cell span{display:block;font-size:.78rem;color:var(--muted)}
.cell b{font-size:1.2rem}
.tabs{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px;margin:6px 0}
th,td{border:2px solid var(--ink);padding:5px 6px;text-align:center}
th{background:var(--grey);font-size:.85rem}
td.l{text-align:left;font-weight:700;white-space:nowrap}
.two-days{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.day{border:3px solid var(--ink);border-radius:16px;padding:10px 12px;text-align:center;background:#fff}
.day.win{background:var(--warm)}
.day h4{margin:0;font-size:1rem}
.day .big{font-size:1.8rem;font-weight:700;line-height:1.2}
.day small{display:block;color:var(--muted)}
.note{border:3px solid var(--ink);border-radius:16px;background:var(--lav);padding:12px 16px;margin:16px 0}
.note>b:first-child{display:block;margin-bottom:4px}
.note p{margin:4px 0}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--ink);text-align:center;padding:0 6px}
.think{border-left:6px solid var(--teal);padding:4px 12px;margin:10px 0;font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
#map{height:320px;border:2px solid var(--ink);border-radius:14px;margin:8px 0}
.leaflet-tooltip.lbl{font-family:inherit;font-weight:700;font-size:15px;color:#14211f;border:2px solid #14211f;border-radius:8px}
details{margin:10px 0}
summary{cursor:pointer;font-weight:700;min-height:36px}
footer{max-width:860px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:.85rem}
footer a{color:inherit}
.sr{position:absolute;left:-9999px}
@media (max-width:520px){html{font-size:17px}.two-days{grid-template-columns:1fr}.band h1{font-size:1.35rem}}
@media (prefers-reduced-motion:no-preference){.fb{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.97);opacity:.4}}}
</style>
</head>
<body>
<div class="band"><div class="in">
 <svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true"><circle cx="19" cy="19" r="13" fill="#fff" stroke="#14211f" stroke-width="4"/><path d="M29 29l12 12" stroke="#14211f" stroke-width="6" stroke-linecap="round"/><path d="M13 21l4-5 4 3 4-6" fill="none" stroke="#14211f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
 <div><h1>Klimadetektive</h1><p>Wir lösen Wetter-Fälle mit echten Messwerten.</p></div>
</div></div>
<main id="app" aria-live="polite"></main>
<footer>Messwerte: MeteoSchweiz. <a href="./">Alle Messwerte (Wetter-Anzeige)</a></footer>

<script>
'use strict';
/* ---------- Daten ---------- */
const MCH='https://data.geo.admin.ch/ch.meteoschweiz.ogd-smn/';
const ST={lug:{n:'Lugano',kt:'Tessin',h:273,ll:[46.0,8.9603]},sma:{n:'Zürich',kt:'Zürich',h:556,ll:[47.3778,8.5657]},zer:{n:'Zermatt',kt:'Wallis',h:1638,ll:[46.0295,7.7525]}};
const FIX=['2026-11-06','2026-11-12'];           // Fr 6.11. (Messtag 1) und Do 12.11. (Messtag 2)
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const p2=n=>String(n).padStart(2,'0');
const num=v=>(v===undefined||v===''||v==='-'||isNaN(+v))?null:+v;
function zurichKey(ms){const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Zurich',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(ms)).map(x=>[x.type,x.value]));return p.year+'-'+p.month+'-'+p.day+'T'+p.hour+':'+p.minute}
const todayKey=()=>zurichKey(Date.now()).slice(0,10);
const kms=k=>Date.UTC(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8,10),+k.slice(11,13)||0,+k.slice(14,16)||0);
function addDays(k,n){const t=new Date(kms(k)+n*864e5);return t.toISOString().slice(0,10)}
function dlabel(k){const w=new Date(kms(k)).getUTCDay();return WD[w]+' '+(+k.slice(8,10))+'.'+(+k.slice(5,7))+'.'}
function parseOGD(txt){const L=txt.trim().split(/\r?\n/),H=L[0].split(';'),ix=n=>H.indexOf(n);const c={t:ix('tre200s0'),ws:ix('fkl010z0'),wk:ix('fu3010z0'),ts:ix('reference_timestamp')};
 return L.slice(1).map(l=>{const a=l.split(';'),m=(a[c.ts]||'').match(/(\d+)\.(\d+)\.(\d+) (\d+):(\d+)/);if(!m)return null;const ms=Date.UTC(+m[3],+m[2]-1,+m[1],+m[4],+m[5]);
  const ws=c.ws>=0&&num(a[c.ws])!=null?num(a[c.ws]):(c.wk>=0&&num(a[c.wk])!=null?num(a[c.wk])/3.6:null);
  return[zurichKey(ms),num(a[c.t]),ws]}).filter(r=>r&&(r[1]!=null||r[2]!=null))}
async function getTxt(url){const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),12000);try{const r=await fetch(url,{signal:ctl.signal,cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.text()}finally{clearTimeout(to)}}
const mkMap=rows=>new Map(rows.map(r=>[r[0],r]));
const DIAG=[];
/* Server-Cache /api/ogd: alle Kinder bekommen dieselbe kleine Antwort (letzte 21 Tage). */
async function fetchApi(code){const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),8000);
 try{const r=await fetch('/api/ogd?st='+code,{signal:ctl.signal});if(!r.ok)throw new Error('API '+r.status);const v=await r.json();if(!Array.isArray(v)||!v.length)throw new Error('API leer');DIAG.push(code+': API ok');return mkMap(v)}
 catch(e){DIAG.push(code+': API '+(e.name==='AbortError'?'Zeit':e.message));throw e}finally{clearTimeout(to)}}
const hasDay=(mp,day)=>mp.has(day+'T08:00')||mp.has(day+'T12:00')||mp.has(day+'T10:00');
async function fetchDirect(code,day,old){
 const base=MCH+code+'/ogd-smn_'+code+'_t_';let mp=new Map();
 try{mp=mkMap(parseOGD(await getTxt(base+'now.csv')));DIAG.push(code+': Datei now ok')}catch(e){DIAG.push(code+': Datei now '+e.message)}
 if(!hasDay(mp,day)&&day<todayKey()){try{parseOGD(await getTxt(base+'recent.csv')).forEach(r=>mp.set(r[0],r));DIAG.push(code+': Datei recent ok')}catch(e){DIAG.push(code+': Datei recent '+e.message)}}
 if(old)old.forEach((v,k)=>{if(!mp.has(k))mp.set(k,v)});
 if(!mp.size)throw new Error('keine Daten für '+code);return mp}
const CACHE={};   // code -> {t, mp}
async function station(code,day){
 const today=todayKey(),c=CACHE[code];
 if(c&&Date.now()-c.t<240000&&(day>=today||hasDay(c.mp,day)))return c.mp;
 if(!c||Date.now()-c.t>=240000){try{const mp=await fetchApi(code);CACHE[code]={t:Date.now(),mp};if(day>=today||hasDay(mp,day))return mp}catch(e){}}
 const mp=await fetchDirect(code,day,CACHE[code]&&CACHE[code].mp);CACHE[code]={t:Date.now(),mp};return mp}
function newest(mp){let m='';for(const k of mp.keys())if(k>m)m=k;return m}
function daySeries(mp,day,from=480,to=1200){const out=[];for(let m=from;m<=to;m+=10){const r=mp.get(day+'T'+p2(m/60|0)+':'+p2(m%60));if(r&&r[1]!=null)out.push({m,T:r[1]})}return out}
function at(mp,key){const r=mp.get(key);return r&&r[1]!=null?r[1]:null}

/* ---------- kleine Helfer ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fT=v=>v==null?'–':(Math.round(v*10)/10).toFixed(1).replace('.',',').replace('-','−');
const hm=m=>(m/60|0)+':'+p2(m%60);
const bft=v=>{const l=[.3,1.6,3.4,5.5,8,10.8,13.9,17.2];let b=0;for(const x of l)if(v>=x)b++;return b};
const windWord=w=>{if(w==null)return '–';const b=bft(w);return b===0?'windstill':b===1?'fast windstill':b===2?'leichter Wind':b<=4?'mittlerer Wind':'starker Wind'};
const SLOTS=[{n:'Am Morgen',a:'am Morgen',t:'8–10 Uhr',to:600},{n:'Am Mittag',a:'am Mittag',t:'10–13 Uhr',to:780},{n:'Am Nachmittag',a:'am Nachmittag',t:'13–17 Uhr',to:1020},{n:'Am Abend',a:'am Abend',t:'17–20 Uhr',to:1201}];
const slotOf=m=>SLOTS.findIndex(s=>m<s.to);
const ICON={ // kleine Symbole für die Vermutungs-Knöpfe
 sun:(x,y,c)=>`<svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="${x}" cy="${y}" r="6" fill="${c}" stroke="#14211f" stroke-width="2.5"/>${[0,45,90,135,180,225,270,315].map(a=>{const r=a*Math.PI/180;return `<line x1="${x+9*Math.cos(r)}" y1="${y+9*Math.sin(r)}" x2="${x+13*Math.cos(r)}" y2="${y+13*Math.sin(r)}" stroke="#14211f" stroke-width="2.5" stroke-linecap="round"/>`}).join('')}</svg>`
};
function dayOpts(){const t=todayKey(),y=addDays(t,-1),o=[[t,'Heute'],[y,'Gestern']];FIX.forEach(k=>{if(!o.some(x=>x[0]===k))o.push([k,dlabel(k)])});return o}
function chipsFor(g,sel,block){
 const o=dayOpts(),t=todayKey();
 const known=o.some(x=>x[0]===sel);
 return `<div class="chips" role="group" aria-label="Tag wählen">`+o.map(([k,l])=>`<button class="chip" data-act="day" data-g="${g}" data-v="${k}" aria-pressed="${k===sel}" ${k===block?'disabled':''}>${l}${l===dlabel(k)?'':`<small>${dlabel(k)}</small>`}</button>`).join('')+
 `<button class="chip" data-act="cust" data-g="${g}" aria-pressed="${!known}">Anderer Tag…</button>`+
 ((!known||S.cust===g)?`<input type="date" data-g="${g}" data-act="cday" min="${addDays(t,-20)}" max="${t}" value="${sel}" aria-label="Datum wählen">`:'')+`</div>`}

/* ---------- Zustand ---------- */
const S={view:'home',loading:false,err:null,cust:null,
 f1:{day:FIX[0],guess:null,res:null},
 f2:{a:FIX[0],b:FIX[1],guess:null,res:null},
 f3:{day:todayKey(),time:'now',guess:null,res:null,g2:null,map:false}};
let solved={};try{solved=JSON.parse(localStorage.getItem('kd_solved')||'{}')||{}}catch(e){}
const saveSolved=()=>{try{localStorage.setItem('kd_solved',JSON.stringify(solved))}catch(e){}};
let TOKEN=0;

/* ---------- Diagramme ---------- */
function lineChart(o){
 const W=640,H=330,L=56,R=24,T0=36,B=50,x0=480,x1=1200;
 const vals=o.series.flatMap(s=>s.pts.map(p=>p.T));
 let lo=Math.floor(Math.min(...vals)-1),hi=Math.ceil(Math.max(...vals)+1);
 while(hi-lo<4){hi++;if(hi-lo<4)lo--}
 const step=(hi-lo)<=8?1:(hi-lo)<=16?2:5;lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
 const X=m=>L+(m-x0)/(x1-x0)*(W-L-R),Y=t=>T0+(hi-t)/(hi-lo)*(H-T0-B);
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria)}" font-family="Andika,Trebuchet MS,Verdana,sans-serif">`;
 for(let t=lo;t<=hi;t+=step){s+=`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="${t===0?'#14211f':'#c9d1d0'}" stroke-width="${t===0?2.5:1.5}"/><text x="${L-8}" y="${Y(t)+6}" text-anchor="end" font-size="18" fill="#14211f">${String(t).replace('-','−')}</text>`}
 for(let m=x0;m<=x1;m+=120){s+=`<line x1="${X(m)}" x2="${X(m)}" y1="${T0}" y2="${H-B}" stroke="#e3e8e7" stroke-width="1.5"/><text x="${X(m)}" y="${H-B+24}" text-anchor="middle" font-size="18" fill="#14211f">${m/60}</text>`}
 s+=`<text x="${L}" y="20" font-size="17" font-weight="700" fill="#14211f">°C</text><text x="${(L+W-R)/2}" y="${H-6}" text-anchor="middle" font-size="17" fill="#44544f">Uhrzeit</text>`;
 o.series.forEach(se=>{if(se.pts.length>1)s+=`<polyline fill="none" stroke="${se.color}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" ${se.dash?'stroke-dasharray="12 9"':''} points="${se.pts.map(p=>X(p.m).toFixed(1)+','+Y(p.T).toFixed(1)).join(' ')}"/>`});
 (o.dots||[]).forEach(d=>{s+=`<circle cx="${X(d.m)}" cy="${Y(d.T)}" r="7" fill="${d.color||'#fff'}" stroke="#14211f" stroke-width="3"/>`});
 (o.flags||[]).forEach(f=>{const cx=Math.min(W-R-34,Math.max(L+34,X(f.m))),cy=Y(f.T),up=f.pos!=='down';
  s+=`<circle cx="${X(f.m)}" cy="${cy}" r="10" fill="${f.color}" stroke="#14211f" stroke-width="3.5"/><text x="${cx}" y="${cy+(up?-18:32)}" text-anchor="middle" font-size="21" font-weight="700" fill="#14211f" stroke="#fff" stroke-width="5" paint-order="stroke">${f.text}</text>`});
 return s+'</svg>'}

function mountain(vals){
 const W=640,H=380,base=345,top=120,yy=h=>base-h/2000*(base-top);
 const L=ST.lug,Z=ST.sma,M=ST.zer,px={lug:136,sma:278,zer:480};
 const ok=['lug','sma','zer'].filter(k=>vals[k]!=null);
 const cold=ok.length>1?ok.reduce((a,b)=>vals[b]<vals[a]?b:a):null,warm=ok.length>1?ok.reduce((a,b)=>vals[b]>vals[a]?b:a):null;
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Berg mit drei Orten: Lugano ${fT(vals.lug)} Grad, Zürich ${fT(vals.sma)} Grad, Zermatt ${fT(vals.zer)} Grad" font-family="Andika,Trebuchet MS,Verdana,sans-serif">`;
 s+=`<rect width="${W}" height="${H}" fill="#eaf4ff" rx="10"/>`;
 [500,1000,1500].forEach(h=>{s+=`<line x1="8" x2="${W-8}" y1="${yy(h)}" y2="${yy(h)}" stroke="#9db4c8" stroke-width="2" stroke-dasharray="6 7"/><text x="10" y="${yy(h)-6}" font-size="16" fill="#44544f">${h} m</text>`});
 s+=`<path d="M0,${base} L0,${yy(150)} L${px.lug},${yy(L.h)} L${px.sma},${yy(Z.h)} L370,${yy(1100)} L${px.zer},${yy(M.h)} L545,${yy(2000)} L640,${yy(750)} L640,${base} Z" fill="#b9c9a4" stroke="#14211f" stroke-width="4" stroke-linejoin="round"/>`;
 s+=`<path d="M545,${yy(2000)} L${517},${yy(1790)} L530,${yy(1760)} L540,${yy(1800)} L550,${yy(1700)} L560,${yy(1790)} Z" fill="#fff" stroke="#14211f" stroke-width="3" stroke-linejoin="round"/>`;
 [['lug',L],['sma',Z],['zer',M]].forEach(([k,o])=>{const x=px[k],y=yy(o.h),bx=x-68,by=y-84,fill=k===cold?'#d8e1f9':k===warm?'#ffe3a3':'#fff';
  s+=`<line x1="${x}" y1="${by+60}" x2="${x}" y2="${y}" stroke="#14211f" stroke-width="3"/><rect x="${bx}" y="${by}" width="136" height="60" rx="12" fill="${fill}" stroke="#14211f" stroke-width="3.5"/>
  <text x="${x}" y="${by+22}" text-anchor="middle" font-size="19" font-weight="700" fill="#14211f">${o.n}</text><text x="${x}" y="${by+49}" text-anchor="middle" font-size="26" font-weight="700" fill="#14211f">${fT(vals[k])} °C</text>
  <circle cx="${x}" cy="${y}" r="9" fill="#e8453c" stroke="#14211f" stroke-width="3"/><text x="${x}" y="${y+28}" text-anchor="middle" font-size="17" fill="#14211f" stroke="#b9c9a4" stroke-width="5" paint-order="stroke">${o.h} m</text>`});
 return s+'</svg>'}

/* ---------- Ansichten ---------- */
const stepper=n=>{const l=['Vermuten','Spur prüfen','Aufschreiben'];return `<ol class="steps" aria-label="Schritte">`+l.map((t,i)=>`<li class="${i+1===n?'on':i+1<n?'done':''}"><i>${i+1<n?'✓':i+1}</i>${t}</li>`).join('')+`</ol>`};
const head=(n,t,q)=>`<button class="back" data-act="home">← Alle Fälle</button><h2>Fall ${n}: ${t}</h2>`;
const loading=()=>`<div class="load" role="status">Spuren werden gesucht …</div>`;
const failBox=()=>`<div class="fail" role="alert"><b>Die Messwerte kommen gerade nicht an.</b><p>Warte kurz. Tippe dann auf «Nochmals».</p><button class="btn" data-act="retry">Nochmals</button><details><summary>Für die Lehrperson</summary><p class="muted">${esc(DIAG.slice(-8).join(' | ')||'–')}<br>${esc(S.err||'')}</p></details></div>`;
const noteBox=(lines)=>`<div class="note"><b>✏️ Schreib in dein Heft:</b>${lines.map(l=>`<p>${l}</p>`).join('')}</div>`;
const doneBtns=(id)=>`<div class="actions"><button class="btn" data-act="solve" data-v="${id}">Fall gelöst ✓</button><button class="btn light" data-act="again" data-v="${id}">Nochmals mit anderem Tag</button></div>`;
const FB=(cls,t,body)=>`<div class="fb ${cls}" id="fb" tabindex="-1" role="status"><strong>${t}</strong>${body}</div>`;
const winTxt=(hit)=>hit?'Stimmt! Gut vermutet.':'';

function viewHome(){
 const n=Object.keys(solved).filter(k=>solved[k]).length;
 return `<div id="now" class="now" aria-live="off"><small>Jetzt in Zürich …</small></div>
 <p><b>So geht's:</b> Zuerst vermutest du. Dann prüfst du die Spur mit den Messwerten. Zum Schluss schreibst du es ins Heft.</p>
 <div class="cards">
 ${[['1','Der warme Tag','Wann ist es am wärmsten?'],['2','Zwei Tage','Welcher Tag war wärmer?'],['3','Drei Orte','Wo ist es am kältesten?']].map(([i,t,q])=>`<button class="card ${solved[i]?'solved':''}" data-act="open" data-v="${i}"><span class="n">${i}</span><div><b>${t}</b><span>${q}</span></div>${solved[i]?'<span class="star" aria-label="gelöst">⭐</span>':''}</button>`).join('')}
 </div>${n===3?`<div class="fb"><strong>Alle Fälle gelöst!</strong>Du bist jetzt Klimadetektiv oder Klimadetektivin.</div>`:''}`}

function viewF1(){
 const f=S.f1;let h=head(1,'Der warme Tag');
 h+=stepper(f.res?3:f.guess?2:1);
 h+=`<h3>Welcher Tag?</h3>`+chipsFor('f1',f.day);
 h+=`<p class="q">Wann ist es am wärmsten? Tippe deine Vermutung.</p><div class="opts two">`+SLOTS.map((s,i)=>`<button class="opt" data-act="g1" data-v="${i}" aria-pressed="${f.guess===i}"><span><span>${s.n}</span><small>${s.t}</small></span></button>`).join('')+`</div>`;
 if(S.loading&&f.guess!=null)return h+loading();
 if(S.err&&f.guess!=null)return h+failBox();
 if(f.res)h+=res1(f.res);
 return h}
function res1(r){
 if(r.empty)return FB('no','Hier fehlt die Spur.','<p>Für diesen Tag gibt es keine Messwerte. Wähle einen anderen Tag.</p>');
 const g=S.f1.guess,tg=slotOf(r.mx.m),hit=g===tg,near=Math.abs(g-tg)===1;
 let fb=hit?FB('', 'Stimmt! Gut vermutet.',`<p>Am wärmsten war es um ${hm(r.mx.m)} Uhr: <b>${fT(r.mx.T)} °C</b>.</p>`)
  :FB(near?'near':'no',near?'Knapp daneben.':'Nicht ganz.',`<p>Du hast <b>${SLOTS[g].a}</b> vermutet. Am wärmsten war es <b>${SLOTS[tg].a}</b>, um ${hm(r.mx.m)} Uhr: <b>${fT(r.mx.T)} °C</b>.</p>`);
 if(r.partial)fb+=`<p class="muted">Der Tag ist noch nicht zu Ende. Schau am Abend nochmals.</p>`;
 const fig=`<div class="fig">${lineChart({series:[{pts:r.s,color:'#0e8a72'}],dots:r.dots,flags:[{m:r.mx.m,T:r.mx.T,text:fT(r.mx.T)+' °C',color:'#ffb347',pos:'up'},{m:r.mn.m,T:r.mn.T,text:fT(r.mn.T)+' °C',color:'#d8e1f9',pos:'down'}],aria:'Temperatur am '+dlabel(S.f1.day)+' von 8 bis 20 Uhr. Am wärmsten um '+hm(r.mx.m)+' Uhr, '+fT(r.mx.T)+' Grad.'})}</div>
  <p class="muted">Orange: am wärmsten. Blau: am kältesten.</p>`;
 const cells=`<h3>Zum Abschreiben</h3><p class="muted">Temperatur alle 2 Stunden, in °C</p><div class="cells">`+[8,10,12,14,16,18,20].map((hh,i)=>`<div class="cell"><span>${hh} Uhr</span><b>${fT(r.h2[i])}</b></div>`).join('')+`</div>`;
 const note=noteBox([`Am <b>${dlabel(S.f1.day)}</b> war es um <span class="blank">${hm(r.mx.m)}</span> Uhr am wärmsten: <span class="blank">${fT(r.mx.T)}</span> °C.`,`Ich habe <span class="blank">richtig / nicht ganz richtig</span> vermutet.`])+`<p class="think">Denk nach: Was macht die Luft warm?</p>`;
 return fb+fig+cells+note+doneBtns('1')}

function viewF2(){
 const f=S.f2;let h=head(2,'Zwei Tage');
 h+=stepper(f.res?3:f.guess?2:1);
 h+=`<h3>Tag A</h3>`+chipsFor('f2a',f.a,f.b)+`<h3>Tag B</h3>`+chipsFor('f2b',f.b,f.a);
 h+=`<p class="q">Welcher Tag war wärmer? Tippe deine Vermutung.</p><div class="opts two">
  <button class="opt" data-act="g2" data-v="A" aria-pressed="${f.guess==='A'}">${dlabel(f.a)} (A)</button>
  <button class="opt" data-act="g2" data-v="B" aria-pressed="${f.guess==='B'}">${dlabel(f.b)} (B)</button>
  <button class="opt" data-act="g2" data-v="eq" aria-pressed="${f.guess==='eq'}">Gleich warm</button></div>`;
 if(S.loading&&f.guess)return h+loading();
 if(S.err&&f.guess)return h+failBox();
 if(f.res)h+=res2(f.res);
 return h}
function res2(r){
 if(r.empty)return FB('no','Hier fehlt eine Spur.',`<p>Für ${esc(r.empty)} gibt es keine Messwerte. Wähle einen anderen Tag.</p>`);
 const g=S.f2.guess,A=dlabel(S.f2.a),B=dlabel(S.f2.b),d=r.avgA-r.avgB,ad=Math.abs(d),truth=ad<0.5?'eq':d>0?'A':'B',hit=g===truth;
 const warmer=truth==='A'?A:B;
 let body=truth==='eq'?`<p>Die Tage waren fast gleich warm. Der Unterschied ist nur <b>${fT(ad)} °C</b>.</p>`:`<p><b>${warmer}</b> war im Schnitt <b>${fT(ad)} °C</b> wärmer.</p>`;
 let title=hit?'Stimmt! Gut vermutet.':(g==='eq'||truth==='eq')?'Knapp daneben.':'Nicht ganz.';
 let fb=FB(hit?'':(g==='eq'||truth==='eq')?'near':'no',title,body);
 if(r.partial)fb+=`<p class="muted">Ein Tag ist noch nicht zu Ende. Der Vergleich ist noch nicht fair.</p>`;
 const cardsH=`<div class="two-days"><div class="day ${truth==='A'?'win':''}"><h4>A: ${A}</h4><div class="big">${fT(r.avgA)} °C</div><small>im Schnitt</small><small>am wärmsten: ${fT(r.mxA)} °C</small></div><div class="day ${truth==='B'?'win':''}"><h4>B: ${B}</h4><div class="big">${fT(r.avgB)} °C</div><small>im Schnitt</small><small>am wärmsten: ${fT(r.mxB)} °C</small></div></div>
 <p class="muted">Schnitt = ein typischer Wert für den ganzen Tag (8 bis 20 Uhr).</p>`;
 const fig=`<div class="fig">${lineChart({series:[{pts:r.sA,color:'#0e8a72'},{pts:r.sB,color:'#d9780a',dash:true}],aria:'Temperatur an zwei Tagen von 8 bis 20 Uhr: '+A+' und '+B+'.'})}<div class="legend"><span><i></i>A: ${A}</span><span><i class="b"></i>B: ${B}</span></div></div>`;
 const tbl=`<h3>Zum Abschreiben</h3><div class="tabs"><table><thead><tr><th>Uhr</th>${[8,10,12,14,16,18,20].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody><tr><td class="l">A: ${A}</td>${r.hA.map(v=>`<td>${fT(v)}</td>`).join('')}</tr><tr><td class="l">B: ${B}</td>${r.hB.map(v=>`<td>${fT(v)}</td>`).join('')}</tr></tbody></table></div>`;
 const note=noteBox([truth==='eq'?`Am <b>${A}</b> und am <b>${B}</b> war es fast gleich warm.`:`Am <b>${warmer}</b> war es wärmer: im Schnitt <span class="blank">${fT(ad)}</span> °C mehr.`,`Ich vermute, dass … <span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span> weil … <span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>`])+`<p class="think">Denk nach: Was war an den Tagen anders? Sonne? Wolken? Wind?</p>`;
 return fb+cardsH+fig+tbl+note+doneBtns('2')}

function timeChips(){const f=S.f3,t=todayKey();const o=[...(f.day===t?[['now','Jetzt']]:[]),['08','8 Uhr'],['12','12 Uhr'],['16','16 Uhr']];
 return `<div class="chips" role="group" aria-label="Zeit wählen">`+o.map(([k,l])=>`<button class="chip" data-act="time" data-v="${k}" aria-pressed="${f.time===k}">${l}</button>`).join('')+`</div>`}
function viewF3(){
 const f=S.f3;let h=head(3,'Drei Orte');
 h+=stepper(f.res?(f.g2?3:2):1);
 h+=`<h3>Welcher Tag?</h3>`+chipsFor('f3',f.day)+`<h3>Welche Zeit?</h3>`+timeChips();
 h+=`<p class="q">Wo ist es am kältesten? Tippe deine Vermutung.</p><div class="opts two">`+['lug','sma','zer'].map(k=>`<button class="opt" data-act="g3" data-v="${k}" aria-pressed="${f.guess===k}"><span><span>${ST[k].n}</span><small>${ST[k].kt}</small></span></button>`).join('')+`</div>`;
 if(S.loading&&f.guess)return h+loading();
 if(S.err&&f.guess)return h+failBox();
 if(f.res)h+=res3(f.res);
 return h}
function res3(r){
 const f=S.f3,v=r.v,have=['lug','sma','zer'].filter(k=>v[k]!=null);
 if(have.length<2)return FB('no','Hier fehlt eine Spur.','<p>Von einem Ort gibt es keine Messwerte. Wähle eine andere Zeit.</p>');
 const cold=have.reduce((a,b)=>v[b]<v[a]?b:a),warm=have.reduce((a,b)=>v[b]>v[a]?b:a),hit=f.guess===cold,missing=have.length<3;
 let fb=hit?FB('','Stimmt! Gut vermutet.',`<p>Am kältesten ist es in <b>${ST[cold].n}</b>: <b>${fT(v[cold])} °C</b>.</p>`)
  :FB('no','Nicht ganz.',`<p>Du hast <b>${ST[f.guess].n}</b> vermutet. Am kältesten ist es in <b>${ST[cold].n}</b>: <b>${fT(v[cold])} °C</b>.</p>`);
 if(missing)fb+=`<p class="muted">Von einem Ort fehlen die Messwerte.</p>`;
 const mt=`<div class="fig">${mountain(v)}</div><p class="muted">Blau: am kältesten. Gelb: am wärmsten. Zeit: ${dlabel(r.day)}, ${hm(+r.key.slice(11,13)*60+ +r.key.slice(14,16))} Uhr.</p>
 <button class="btn light" data-act="map">${f.map?'Karte zudecken':'Wo liegen die Orte? Karte zeigen'}</button>${f.map?`<div id="map" role="img" aria-label="Karte mit Lugano, Zürich und Zermatt"></div>`:''}`;
 let q2=`<p class="q">Was fällt dir auf? Je höher der Ort, desto …</p><div class="opts two">`+[['k','kälter'],['w','wärmer'],['g','gleich warm']].map(([k,l])=>`<button class="opt" data-act="g3b" data-v="${k}" aria-pressed="${f.g2===k}">${l}</button>`).join('')+`</div>`;
 let fb2='',note='';
 if(f.g2){
  const t=have.length===3?(v.lug-v.sma>=0.3&&v.sma-v.zer>=0.3?'k':v.sma-v.lug>=0.3&&v.zer-v.sma>=0.3?'w':'m'):'m';
  if(f.g2==='k'&&t==='k')fb2=FB('','Stimmt! Je höher, desto kälter.','<p>Die Luft wird oben kälter.</p>');
  else if(t==='k')fb2=FB('no','Nicht ganz.','<p>Hier wird es mit der Höhe <b>kälter</b>.</p>');
  else if(t==='w')fb2=FB(f.g2==='w'?'':'no',f.g2==='w'?'Stimmt für diese Zeit!':'Nicht ganz.','<p>Heute ist es oben <b>wärmer</b>. Das ist selten.</p>');
  else {const pair=have.length===3&&v.zer>=v.sma-0.3?'Zermatt ist nicht kälter als Zürich.':v.sma>v.lug-0.3?'Zürich ist nicht kälter als Lugano.':'Die Werte passen nicht ganz zur Höhe.';
   fb2=FB('near',f.g2==='k'?'Meistens stimmt das. Heute nicht ganz.':'Nicht ganz.',`<p>${pair} Meistens gilt: Je höher, desto kälter.</p>${v.zer>=v.sma-0.3&&have.length===3?'<p class="muted">Bei Nebel im Mittelland kann das vorkommen.</p>':''}`)}
  note=noteBox([`<b>Lugano</b> (273 m): <span class="blank">${fT(v.lug)}</span> °C · <b>Zürich</b> (556 m): <span class="blank">${fT(v.sma)}</span> °C · <b>Zermatt</b> (1638 m): <span class="blank">${fT(v.zer)}</span> °C`,`Je höher der Ort, desto <span class="blank">${t==='k'?'kälter':t==='w'?'wärmer':'…'}</span>.`,`Ich vermute, dass … <span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span> weil … <span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>`])+doneBtns('3');
 }
 return fb+mt+q2+fb2+note}

function render(){
 const m={home:viewHome,'1':viewF1,'2':viewF2,'3':viewF3}[S.view]||viewHome;
 $('#app').innerHTML=m();
 if(S.view==='home')showNow();
 if(S.view==='3'&&S.f3.map&&S.f3.res)drawMap();
}

/* ---------- Jetzt-Streifen und Karte ---------- */
async function showNow(){
 try{const mp=await station('sma',todayKey()),k=newest(mp),r=mp.get(k),lag=Math.round((kms(zurichKey(Date.now()))-kms(k))/60000),el=$('#now');
  if(!el)return;
  el.innerHTML=`<span>Jetzt in Zürich:</span><b>${fT(r[1])} °C</b><span>${windWord(r[2])}</span><small>Stand ${k.slice(11)} Uhr${lag>90?' (Daten sind verspätet)':''}</small>`}
 catch(e){const el=$('#now');if(el)el.remove()}}
let LEAF=null;
function loadLeaflet(){if(window.L)return Promise.resolve();if(LEAF)return LEAF;
 LEAF=new Promise((ok,no)=>{const c=document.createElement('link');c.rel='stylesheet';c.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';document.head.appendChild(c);const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});return LEAF}
let MAPO=null;
async function drawMap(){try{await loadLeaflet()}catch(e){const el=$('#map');if(el)el.outerHTML='<p class="muted">Die Karte konnte nicht geladen werden.</p>';return}
 const el=$('#map');if(!el||!window.L)return;if(MAPO){MAPO.remove();MAPO=null}
 MAPO=L.map(el,{scrollWheelZoom:false});
 L.tileLayer('https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-farbe/default/current/3857/{z}/{x}/{y}.jpeg',{maxZoom:18,attribution:'© swisstopo'}).addTo(MAPO);
 const pts=[];['lug','sma','zer'].forEach(k=>{pts.push(ST[k].ll);L.circleMarker(ST[k].ll,{radius:10,color:'#14211f',weight:3,fillColor:'#e8453c',fillOpacity:1}).addTo(MAPO).bindTooltip(ST[k].n,{permanent:true,direction:'top',className:'lbl'})});
 MAPO.fitBounds(L.latLngBounds(pts),{padding:[40,40]})}

/* ---------- Berechnung der Spuren ---------- */
const H2=[8,10,12,14,16,18,20];
const partialDay=day=>{const n=zurichKey(Date.now());return day===n.slice(0,10)&&(+n.slice(11,13)*60+ +n.slice(14,16))<1200};
async function calc1(){const f=S.f1,mp=await station('sma',f.day),s=daySeries(mp,f.day);
 if(s.length<3)return{empty:true};
 const mx=s.reduce((a,b)=>b.T>a.T?b:a),mn=s.reduce((a,b)=>b.T<a.T?b:a);
 const h2=H2.map(h=>at(mp,f.day+'T'+p2(h)+':00'));
 return{s,mx,mn,h2,dots:H2.map((h,i)=>h2[i]!=null?{m:h*60,T:h2[i]}:null).filter(Boolean),partial:partialDay(f.day)}}
async function calc2(){const f=S.f2,[ma,mb]=await Promise.all([station('sma',f.a),station('sma',f.b)]);
 const sA=daySeries(ma,f.a),sB=daySeries(mb,f.b);
 if(sA.length<3)return{empty:dlabel(f.a)};if(sB.length<3)return{empty:dlabel(f.b)};
 const avg=a=>a.reduce((x,y)=>x+y.T,0)/a.length,mxf=a=>Math.max(...a.map(x=>x.T));
 return{sA,sB,avgA:avg(sA),avgB:avg(sB),mxA:mxf(sA),mxB:mxf(sB),hA:H2.map(h=>at(ma,f.a+'T'+p2(h)+':00')),hB:H2.map(h=>at(mb,f.b+'T'+p2(h)+':00')),partial:partialDay(f.a)||partialDay(f.b)}}
async function calc3(){const f=S.f3,codes=['lug','sma','zer'];
 const res=await Promise.allSettled(codes.map(c=>station(c,f.day)));
 const mps={};res.forEach((x,i)=>{if(x.status==='fulfilled')mps[codes[i]]=x.value});
 if(!Object.keys(mps).length)throw new Error('keine Daten');
 let key;
 if(f.time==='now'){const ks=Object.values(mps).map(newest).filter(Boolean);key=ks.sort()[0]}   // gemeinsamer neuester Wert
 else key=f.day+'T'+f.time+':00';
 const v={};codes.forEach(c=>{v[c]=mps[c]?at(mps[c],key):null});
 return{v,key,day:key.slice(0,10)}}

async function run(which){
 const my=++TOKEN;S.loading=true;S.err=null;render();
 try{const r=await {1:calc1,2:calc2,3:calc3}[which]();if(my!==TOKEN)return;S['f'+which].res=r}
 catch(e){if(my!==TOKEN)return;S.err=e.message||'Fehler'}
 S.loading=false;render();
 const fb=$('#fb');if(fb){try{fb.scrollIntoView({block:'start',behavior:'smooth'});fb.focus({preventScroll:true})}catch(e){}}}
function reset(which){TOKEN++;S.loading=false;S.err=null;const f=S['f'+which];f.guess=null;f.res=null;if(which==='3'){f.g2=null}}

/* ---------- Klicks ---------- */
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT')return;const a=b.dataset.act,v=b.dataset.v,g=b.dataset.g;
 if(a==='home'){TOKEN++;S.view='home';S.loading=false;S.err=null;S.cust=null;render();scrollTo(0,0)}
 else if(a==='open'){S.view=v;render();scrollTo(0,0)}
 else if(a==='day'){S.cust=null;
  if(g==='f1'){S.f1.day=v;reset('1')}
  else if(g==='f2a'){S.f2.a=v;reset('2')}
  else if(g==='f2b'){S.f2.b=v;reset('2')}
  else if(g==='f3'){S.f3.day=v;if(v!==todayKey()&&S.f3.time==='now')S.f3.time='12';reset('3')}
  render()}
 else if(a==='cust'){S.cust=S.cust===g?null:g;render();const i=document.querySelector('input[type=date]');if(i)i.focus()}
 else if(a==='time'){S.f3.time=v;reset('3');render()}
 else if(a==='g1'){S.f1.guess=+v;S.f1.res=null;run(1)}
 else if(a==='g2'){S.f2.guess=v;S.f2.res=null;run(2)}
 else if(a==='g3'){S.f3.guess=v;S.f3.res=null;S.f3.g2=null;run(3)}
 else if(a==='g3b'){S.f3.g2=v;render();const n=document.querySelectorAll('.fb');const l=n[n.length-1];if(l)try{l.scrollIntoView({block:'center',behavior:'smooth'})}catch(x){}}
 else if(a==='map'){S.f3.map=!S.f3.map;render()}
 else if(a==='retry'){const w=S.view;S.err=null;if(w==='1'&&S.f1.guess!=null)run(1);else if(w==='2'&&S.f2.guess)run(2);else if(w==='3'&&S.f3.guess)run(3)}
 else if(a==='solve'){solved[v]=true;saveSolved();S.view='home';render();scrollTo(0,0)}
 else if(a==='again'){reset(v);render();scrollTo(0,0)}
});
document.addEventListener('change',e=>{const i=e.target;if(i.dataset.act!=='cday'||!i.value)return;const g=i.dataset.g,v=i.value,t=todayKey();
 if(v>t)return;S.cust=g;
 if(g==='f1'){S.f1.day=v;reset('1')}else if(g==='f2a'){S.f2.a=v;reset('2')}else if(g==='f2b'){S.f2.b=v;reset('2')}
 else if(g==='f3'){S.f3.day=v;if(v!==t&&S.f3.time==='now')S.f3.time='12';reset('3')}
 render()});
render();
</script>
