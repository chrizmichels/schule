<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Klimadetektive 4b</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Klimadetektive: Stil «Kommissariat» (Schreibtisch, Aktenmappen, Stempel). Eine Akte = eine Frage. Erst vermuten, dann die Spur (Messwerte) prüfen, dann ins Heft schreiben. */
:root{--desk:#dde3de;--folder:#e7d6ae;--folder-edge:#cdb886;--paper:#fbfaf6;--ink:#1c2420;--muted:#5b6660;--rule:#d4d9d3;--stamp:#b3302a;--ok:#1d7f4c;--ok-soft:#ddf0e3;--bad:#b3302a;--bad-soft:#f8e1dd;--hl:#f2d24b;--hl-soft:#f7ebb0;--blue:#2d62c4;--orange:#c9661a;--cold:#cfe0f7;
 --f-display:"Zilla Slab",Rockwell,Georgia,serif;--f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;--f-type:"Courier Prime","Courier New",ui-monospace,monospace;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.5}
main{max-width:1000px;margin:0 auto;padding:30px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:6px 0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.muted{color:var(--muted);font-size:.9rem}
.lbl{font-family:var(--f-type);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Titelblatt */
.cover{background:var(--folder);border:1px solid var(--folder-edge);border-radius:4px 14px 14px 14px;padding:26px clamp(18px,4vw,40px) 26px;position:relative;display:flex;flex-direction:column;gap:14px;margin-top:30px}
.cover::before{content:"Aktenzeichen 4b.K.1";position:absolute;top:-30px;left:-1px;background:var(--folder);border:1px solid var(--folder-edge);border-bottom:0;border-radius:10px 10px 0 0;padding:5px 16px 4px;font-family:var(--f-type);font-size:13px;color:var(--muted)}
.cover h1{font-family:var(--f-display);font-weight:700;font-size:clamp(40px,8vw,72px);line-height:.98;letter-spacing:-.01em}
.cover h1 span{display:block;font-size:.34em;letter-spacing:.14em;text-transform:uppercase;font-family:var(--f-type);font-weight:700;color:var(--muted);margin-bottom:8px}
.cover p{max-width:44ch;margin:0}
.bigstamp{position:absolute;right:clamp(14px,4vw,40px);top:22px;border:4px solid var(--stamp);color:var(--stamp);font-family:var(--f-type);font-weight:700;font-size:clamp(13px,2.2vw,19px);letter-spacing:.12em;padding:6px 12px;border-radius:6px;transform:rotate(-9deg);text-align:center;line-height:1.15;opacity:.85;animation:slam .5s cubic-bezier(.3,1.4,.6,1)}
.bigstamp b{display:block;font-size:2em;letter-spacing:.04em}
@keyframes slam{0%{transform:rotate(-9deg) scale(2.2);opacity:0}60%{transform:rotate(-9deg) scale(.94);opacity:.95}100%{transform:rotate(-9deg) scale(1);opacity:.85}}
@media (prefers-reduced-motion:reduce){.bigstamp{animation:none}}
@media (max-width:620px){.bigstamp{position:static;align-self:flex-start;transform:rotate(-4deg);animation:none}}
.now{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;background:var(--paper);border:1px solid var(--folder-edge);border-radius:10px;padding:10px 14px;align-self:flex-start}
.now b{font-family:var(--f-display);font-size:1.7rem;line-height:1}
.now small{color:var(--muted);font-family:var(--f-type);font-size:13px}

/* Akten (Fälle) */
.files{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:34px 18px;margin-top:34px}
@media (max-width:860px){.files{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:540px){.files{grid-template-columns:1fr}}
.file{position:relative;background:var(--folder);border:1px solid var(--folder-edge);border-radius:0 10px 10px 10px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.file .tab{position:absolute;top:-25px;left:-1px;background:var(--folder);border:1px solid var(--folder-edge);border-bottom:0;border-radius:8px 8px 0 0;padding:3px 14px 2px;font-family:var(--f-type);font-size:13px;font-weight:700}
.file h3{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.05;text-transform:none;letter-spacing:0;color:var(--ink);margin:0}
.file p{margin:0;color:var(--muted);font-size:17px}
.file .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:8px}
.stars{font-size:26px;line-height:1;color:var(--folder-edge)}
.stars.on{color:var(--stamp)}
.open{background:var(--ink);color:var(--paper);border:0;border-radius:8px;padding:11px 16px;font-weight:700;min-height:46px}
.open:hover{filter:brightness(1.2)}
.solvedst{position:absolute;right:12px;top:10px;border:3px solid var(--stamp);color:var(--stamp);font-family:var(--f-type);font-weight:700;font-size:14px;letter-spacing:.12em;padding:2px 8px;border-radius:4px;transform:rotate(8deg);opacity:.85}

/* Spielleiste und Karte */
.gbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--folder);border:1px solid var(--folder-edge);border-radius:12px;padding:12px 16px;margin-bottom:16px}
.gbar .ttl{font-family:var(--f-display);font-weight:700;font-size:28px;flex:1;min-width:0;line-height:1.1}
.gbar .ttl small{display:block;font-family:var(--f-type);font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;font-weight:400}
.back{background:var(--paper);border:1px solid var(--folder-edge);border-radius:8px;padding:10px 14px;min-height:46px;font-weight:700}
.back:hover{border-color:var(--ink)}
.qcard{background:var(--paper);border:1px solid var(--rule);border-radius:4px 14px 14px 14px;padding:clamp(16px,3.5vw,30px);box-shadow:0 1px 0 var(--rule),0 8px 24px rgba(20,30,25,.08)}
h3{font-family:var(--f-type);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:18px 0 6px}
.q{font-family:var(--f-display);font-size:clamp(24px,3.6vw,30px);font-weight:700;line-height:1.2;margin:20px 0 6px}
.steps{display:flex;gap:6px;margin:0 0 4px;padding:0;list-style:none}
.steps li{flex:1;display:flex;flex-direction:column;gap:5px;font-family:var(--f-type);font-size:13px;font-weight:700;color:var(--muted)}
.steps li::before{content:"";height:10px;border-radius:3px;background:var(--rule)}
.steps li.done::before{background:var(--ok)}
.steps li.on::before{background:var(--ink)}
.steps li.on{color:var(--ink)}
.steps li i{display:none}

/* Auswahl */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.chip{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:52px;padding:6px 16px;border:2px solid var(--rule);border-radius:10px;background:var(--desk);font-weight:700;line-height:1.15;font-size:18px}
.chip small{font-weight:400;font-size:13px;color:var(--muted);font-family:var(--f-type)}
.chip:hover:not(:disabled){border-color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[aria-pressed=true] small{color:#cfd6d1}
.chip:disabled{opacity:.4;cursor:not-allowed}
.chips input[type=date]{font:inherit;min-height:52px;border:2px solid var(--rule);border-radius:10px;padding:4px 10px;background:var(--desk);color:var(--ink)}
.opts{display:grid;gap:10px;margin:10px 0}
.opts.two{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:12px 16px;border:2px solid var(--rule);border-radius:10px;background:var(--desk);text-align:left;font-weight:700;font-size:20px;line-height:1.2;transition:transform .08s}
.opt small{display:block;font-family:var(--f-type);font-weight:400;font-size:14px;color:var(--muted)}
.opt:hover{border-color:var(--ink);transform:translateY(-1px)}
.opt[aria-pressed=true]{border-color:var(--ink);background:var(--hl-soft);box-shadow:inset 6px 0 0 var(--ink)}
.load{padding:18px;border:2px dashed var(--muted);border-radius:12px;text-align:center;font-family:var(--f-type);font-weight:700;margin:16px 0}

/* Rückmeldung wie ein Stempel auf dem Blatt */
.fb{position:relative;border:2px solid var(--ok);border-radius:10px;padding:12px 16px;margin:16px 0 8px;background:var(--ok-soft)}
.fb.near{border-color:var(--folder-edge);background:var(--hl-soft)}
.fb.no{border-color:var(--bad);background:var(--bad-soft)}
.fb strong{display:block;font-family:var(--f-display);font-size:26px;line-height:1.15;padding-right:0}
.fb .stp{position:absolute;right:12px;top:-14px;background:var(--paper);border:3px solid var(--ok);color:var(--ok);font-family:var(--f-type);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding:1px 8px;border-radius:4px;transform:rotate(4deg)}
.fb:focus{outline:none}
.fb.info{background:#fff;border-color:var(--ink)}
.rot{color:#d62828;font-weight:700}.blau{color:#1d4ed8;font-weight:700}
.auftrag{border:2px solid var(--ink);border-radius:10px;padding:6px 16px 14px;background:#fff;margin:14px 0}
.auftrag ol{margin:6px 0 10px;padding-left:24px;display:flex;flex-direction:column;gap:8px;font-size:1.05rem}
.chk{display:flex;align-items:center;gap:12px;padding:10px 14px;border:2px solid var(--rule);border-radius:10px;background:var(--desk);margin:8px 0;cursor:pointer;font-weight:700;min-height:54px}
.chk input{width:28px;height:28px;flex:none;accent-color:var(--ink);margin:0}
.chk:has(input:checked){background:var(--ok-soft);border-color:var(--ok)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.explore{border:1px dashed var(--muted);border-radius:10px;padding:6px 14px;margin:16px 0}
.orte{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0}
.ort{border:2px solid var(--ink);border-radius:10px;padding:10px 6px;text-align:center;background:#fff;display:flex;flex-direction:column;gap:2px}
.ort b{font-family:var(--f-display);font-size:1.25rem}
.ort small{color:var(--muted);font-family:var(--f-type);font-size:12px}
.ort .t{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,5vw,34px);line-height:1.2}
.day.a{border-top:8px solid #d62828}.day.b{border-top:8px solid #1d4ed8}
.day.win.a{border-top-color:#d62828}.day.win.b{border-top-color:#1d4ed8}

@media (prefers-reduced-motion:no-preference){.fb{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.97);opacity:.4}}}
.fail{border:2px solid var(--bad);border-radius:10px;padding:12px 16px;background:var(--bad-soft);margin:16px 0}
.btn{min-height:50px;padding:10px 20px;border:0;border-radius:10px;background:var(--ink);color:var(--paper);font-weight:700}
.btn:hover{filter:brightness(1.2)}
.btn.light{background:var(--paper);color:var(--ink);border:2px solid var(--rule)}
.btn.light:hover{border-color:var(--ink);filter:none}
.fig{border:1px solid var(--rule);border-radius:10px;padding:8px;margin:12px 0;background:#fff}
.fig svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:4px 0 0;font-weight:700;font-size:.95rem}
.legend i{display:inline-block;width:26px;height:0;border-top:5px solid #d62828;vertical-align:middle;margin-right:6px;border-radius:3px}
.legend i.b{border-top:5px dashed #1d4ed8}
.cells{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.cell{min-width:68px;flex:1 1 68px;text-align:center;border:1px solid var(--folder-edge);border-radius:8px;padding:4px 6px;background:var(--folder)}
.cell span{display:block;font-family:var(--f-type);font-size:12px;color:var(--muted)}
.cell b{font-family:var(--f-type);font-size:1.25rem}
.tabs{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px;margin:6px 0;font-family:var(--f-type)}
th,td{border:1px solid var(--folder-edge);padding:6px;text-align:center}
th{background:var(--folder);font-size:.85rem}
td.l{text-align:left;font-weight:700;white-space:nowrap;background:var(--paper)}
.two-days{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.day{border:2px solid var(--rule);border-radius:10px;padding:10px 12px;text-align:center;background:var(--paper)}
.day.win{background:var(--hl-soft);border-color:var(--ink)}
.day h4{margin:0;font-family:var(--f-type);font-size:.95rem}
.day .big{font-family:var(--f-display);font-size:2.1rem;font-weight:700;line-height:1.2}
.day small{display:block;color:var(--muted);font-size:.9rem}
.note{border:2px dashed var(--muted);border-radius:10px;background:#fffdf2;padding:12px 16px;margin:18px 0;font-family:var(--f-type);font-size:1.02rem}
.note>b:first-child{display:block;margin-bottom:4px;font-family:var(--f-display);font-size:1.3rem}
.note p{margin:6px 0;line-height:1.7}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--ink);text-align:center;padding:0 6px;font-weight:700}
.think{border-left:6px solid var(--stamp);padding:4px 12px;margin:12px 0;font-family:var(--f-display);font-size:1.3rem;font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 4px}
#map{height:320px;border:1px solid var(--rule);border-radius:10px;margin:8px 0}
.leaflet-tooltip.lbl{font-family:var(--f-body);font-weight:700;font-size:15px;color:#14211f;border:2px solid #14211f;border-radius:8px;text-transform:none;letter-spacing:0}
details{margin:10px 0}
summary{cursor:pointer;font-weight:700;min-height:36px}
footer{max-width:1000px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:.85rem;font-family:var(--f-type)}
footer a{color:inherit}
@media (max-width:520px){body{font-size:17px}.two-days{grid-template-columns:1fr}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<footer>Messwerte: MeteoSchweiz. <a href="./">Alle Messwerte (Wetter-Anzeige)</a></footer>

<script>
'use strict';
/* ---------- Daten ---------- */
const MCH='https://data.geo.admin.ch/ch.meteoschweiz.ogd-smn/';
const ST={lug:{n:'Lugano',kt:'Tessin',h:273,ll:[46.0,8.9603]},sma:{n:'Zürich',kt:'Zürich',h:556,ll:[47.3778,8.5657]},zer:{n:'Zermatt',kt:'Wallis',h:1638,ll:[46.0295,7.7525]}};
const FIX=['2026-11-06','2026-11-12'];           // Fr 6.11. (Messtag 1) und Do 12.11. (Messtag 2)
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const p2=n=>String(n).padStart(2,'0');
const num=v=>(v===undefined||v===''||v==='-'||isNaN(+v))?null:+v;
function zurichKey(ms){const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Zurich',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(ms)).map(x=>[x.type,x.value]));return p.year+'-'+p.month+'-'+p.day+'T'+p.hour+':'+p.minute}
const todayKey=()=>zurichKey(Date.now()).slice(0,10);
const kms=k=>Date.UTC(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8,10),+k.slice(11,13)||0,+k.slice(14,16)||0);
function addDays(k,n){const t=new Date(kms(k)+n*864e5);return t.toISOString().slice(0,10)}
function dlabel(k){const w=new Date(kms(k)).getUTCDay();return WD[w]+' '+(+k.slice(8,10))+'.'+(+k.slice(5,7))+'.'}
function parseOGD(txt){const L=txt.trim().split(/\r?\n/),H=L[0].split(';'),ix=n=>H.indexOf(n);const c={t:ix('tre200s0'),ws:ix('fkl010z0'),wk:ix('fu3010z0'),ts:ix('reference_timestamp')};
 return L.slice(1).map(l=>{const a=l.split(';'),m=(a[c.ts]||'').match(/(\d+)\.(\d+)\.(\d+) (\d+):(\d+)/);if(!m)return null;const ms=Date.UTC(+m[3],+m[2]-1,+m[1],+m[4],+m[5]);
  const ws=c.ws>=0&&num(a[c.ws])!=null?num(a[c.ws]):(c.wk>=0&&num(a[c.wk])!=null?num(a[c.wk])/3.6:null);
  return[zurichKey(ms),num(a[c.t]),ws]}).filter(r=>r&&(r[1]!=null||r[2]!=null))}
async function getTxt(url){const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),12000);try{const r=await fetch(url,{signal:ctl.signal,cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.text()}finally{clearTimeout(to)}}
const mkMap=rows=>new Map(rows.map(r=>[r[0],r]));
const DIAG=[];
/* Server-Cache /api/ogd: alle Kinder bekommen dieselbe kleine Antwort (letzte 21 Tage). */
async function fetchApi(code){const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),8000);
 try{const r=await fetch('/api/ogd?st='+code,{signal:ctl.signal});if(!r.ok)throw new Error('API '+r.status);const v=await r.json();if(!Array.isArray(v)||!v.length)throw new Error('API leer');DIAG.push(code+': API ok');return mkMap(v)}
 catch(e){DIAG.push(code+': API '+(e.name==='AbortError'?'Zeit':e.message));throw e}finally{clearTimeout(to)}}
const hasDay=(mp,day)=>mp.has(day+'T08:00')||mp.has(day+'T12:00')||mp.has(day+'T10:00');
async function fetchDirect(code,day,old){
 const base=MCH+code+'/ogd-smn_'+code+'_t_';let mp=new Map();
 try{mp=mkMap(parseOGD(await getTxt(base+'now.csv')));DIAG.push(code+': Datei now ok')}catch(e){DIAG.push(code+': Datei now '+e.message)}
 if(!hasDay(mp,day)&&day<todayKey()){try{parseOGD(await getTxt(base+'recent.csv')).forEach(r=>mp.set(r[0],r));DIAG.push(code+': Datei recent ok')}catch(e){DIAG.push(code+': Datei recent '+e.message)}}
 if(old)old.forEach((v,k)=>{if(!mp.has(k))mp.set(k,v)});
 if(!mp.size)throw new Error('keine Daten für '+code);return mp}
const CACHE={};   // code -> {t, mp}
async function station(code,day){
 const today=todayKey(),c=CACHE[code];
 if(c&&Date.now()-c.t<240000&&(day>=today||hasDay(c.mp,day)))return c.mp;
 if(!c||Date.now()-c.t>=240000){try{const mp=await fetchApi(code);CACHE[code]={t:Date.now(),mp};if(day>=today||hasDay(mp,day))return mp}catch(e){}}
 const mp=await fetchDirect(code,day,CACHE[code]&&CACHE[code].mp);CACHE[code]={t:Date.now(),mp};return mp}
function newest(mp){let m='';for(const k of mp.keys())if(k>m)m=k;return m}
function daySeries(mp,day,from=480,to=1200){const out=[];for(let m=from;m<=to;m+=10){const r=mp.get(day+'T'+p2(m/60|0)+':'+p2(m%60));if(r&&r[1]!=null)out.push({m,T:r[1]})}return out}
function at(mp,key){const r=mp.get(key);return r&&r[1]!=null?r[1]:null}

/* ---------- kleine Helfer ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fT=v=>v==null?'–':(Math.round(v*10)/10).toFixed(1).replace('.',',').replace('-','−');
const hm=m=>(m/60|0)+':'+p2(m%60);
const bft=v=>{const l=[.3,1.6,3.4,5.5,8,10.8,13.9,17.2];let b=0;for(const x of l)if(v>=x)b++;return b};
const windWord=w=>{if(w==null)return '–';const b=bft(w);return b===0?'windstill':b===1?'fast windstill':b===2?'leichter Wind':b<=4?'mittlerer Wind':'starker Wind'};
const SLOTS=[{n:'Am Morgen',a:'am Morgen',t:'8–10 Uhr',to:600},{n:'Am Mittag',a:'am Mittag',t:'10–13 Uhr',to:780},{n:'Am Nachmittag',a:'am Nachmittag',t:'13–17 Uhr',to:1020},{n:'Am Abend',a:'am Abend',t:'17–20 Uhr',to:1201}];
const slotOf=m=>SLOTS.findIndex(s=>m<s.to);
const ICON={ // kleine Symbole für die Vermutungs-Knöpfe
 sun:(x,y,c)=>`<svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="${x}" cy="${y}" r="6" fill="${c}" stroke="#14211f" stroke-width="2.5"/>${[0,45,90,135,180,225,270,315].map(a=>{const r=a*Math.PI/180;return `<line x1="${x+9*Math.cos(r)}" y1="${y+9*Math.sin(r)}" x2="${x+13*Math.cos(r)}" y2="${y+13*Math.sin(r)}" stroke="#14211f" stroke-width="2.5" stroke-linecap="round"/>`}).join('')}</svg>`
};

function chipsFor(g,sel,block){

 f1:{day:FIX[0],c:{a:false,b:false,c:false},show:false,res:null,self:null},

/* ---------- Diagramme ---------- */
function lineChart(o){
 const W=640,H=330,L=56,R=24,T0=36,B=50,x0=480,x1=1200;
 const vals=o.series.flatMap(s=>s.pts.map(p=>p.T));
 let lo=Math.floor(Math.min(...vals)-1),hi=Math.ceil(Math.max(...vals)+1);
 while(hi-lo<4){hi++;if(hi-lo<4)lo--}
 const step=(hi-lo)<=8?1:(hi-lo)<=16?2:5;lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
 const X=m=>L+(m-x0)/(x1-x0)*(W-L-R),Y=t=>T0+(hi-t)/(hi-lo)*(H-T0-B);
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria)}" font-family="Atkinson Hyperlegible,Trebuchet MS,Verdana,sans-serif">`;
 for(let t=lo;t<=hi;t+=step){s+=`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="${t===0?'#14211f':'#c9d1d0'}" stroke-width="${t===0?2.5:1.5}"/><text x="${L-8}" y="${Y(t)+6}" text-anchor="end" font-size="18" fill="#14211f">${String(t).replace('-','−')}</text>`}
 for(let m=x0;m<=x1;m+=120){s+=`<line x1="${X(m)}" x2="${X(m)}" y1="${T0}" y2="${H-B}" stroke="#e3e8e7" stroke-width="1.5"/><text x="${X(m)}" y="${H-B+24}" text-anchor="middle" font-size="18" fill="#14211f">${m/60}</text>`}
 s+=`<text x="${L}" y="20" font-size="17" font-weight="700" fill="#14211f">°C</text><text x="${(L+W-R)/2}" y="${H-6}" text-anchor="middle" font-size="17" fill="#44544f">Uhrzeit</text>`;
 o.series.forEach(se=>{if(se.pts.length>1)s+=`<polyline fill="none" stroke="${se.color}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" ${se.dash?'stroke-dasharray="12 9"':''} points="${se.pts.map(p=>X(p.m).toFixed(1)+','+Y(p.T).toFixed(1)).join(' ')}"/>`});
 (o.dots||[]).forEach(d=>{s+=`<circle cx="${X(d.m)}" cy="${Y(d.T)}" r="7" fill="${d.color||'#fff'}" stroke="#14211f" stroke-width="3"/>`});
 (o.flags||[]).forEach(f=>{const cx=Math.min(W-R-34,Math.max(L+34,X(f.m))),cy=Y(f.T),up=f.pos!=='down';
  s+=`<circle cx="${X(f.m)}" cy="${cy}" r="10" fill="${f.color}" stroke="#14211f" stroke-width="3.5"/><text x="${cx}" y="${cy+(up?-18:32)}" text-anchor="middle" font-size="21" font-weight="700" fill="#14211f" stroke="#fff" stroke-width="5" paint-order="stroke">${f.text}</text>`});
 return s+'</svg>'}

function mountain(vals){
 const W=640,H=380,base=345,top=120,yy=h=>base-h/2000*(base-top);
 const L=ST.lug,Z=ST.sma,M=ST.zer,px={lug:136,sma:278,zer:480};
 const ok=['lug','sma','zer'].filter(k=>vals[k]!=null);
 const cold=ok.length>1?ok.reduce((a,b)=>vals[b]<vals[a]?b:a):null,warm=ok.length>1?ok.reduce((a,b)=>vals[b]>vals[a]?b:a):null;
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Berg mit drei Orten: Lugano ${fT(vals.lug)} Grad, Zürich ${fT(vals.sma)} Grad, Zermatt ${fT(vals.zer)} Grad" font-family="Atkinson Hyperlegible,Trebuchet MS,Verdana,sans-serif">`;
 s+=`<rect width="${W}" height="${H}" fill="#eef3f0" rx="10"/>`;
 [500,1000,1500].forEach(h=>{s+=`<line x1="8" x2="${W-8}" y1="${yy(h)}" y2="${yy(h)}" stroke="#9db4c8" stroke-width="2" stroke-dasharray="6 7"/><text x="10" y="${yy(h)-6}" font-size="16" fill="#44544f">${h} m</text>`});
 s+=`<path d="M0,${base} L0,${yy(150)} L${px.lug},${yy(L.h)} L${px.sma},${yy(Z.h)} L370,${yy(1100)} L${px.zer},${yy(M.h)} L545,${yy(2000)} L640,${yy(750)} L640,${base} Z" fill="#c5d3ae" stroke="#1c2420" stroke-width="4" stroke-linejoin="round"/>`;
 s+=`<path d="M545,${yy(2000)} L${517},${yy(1790)} L530,${yy(1760)} L540,${yy(1800)} L550,${yy(1700)} L560,${yy(1790)} Z" fill="#fff" stroke="#14211f" stroke-width="3" stroke-linejoin="round"/>`;
 [['lug',L],['sma',Z],['zer',M]].forEach(([k,o])=>{const x=px[k],y=yy(o.h),bx=x-68,by=y-84,fill=k===cold?'#cfe0f7':k===warm?'#f7e08a':'#fff';
  s+=`<line x1="${x}" y1="${by+60}" x2="${x}" y2="${y}" stroke="#14211f" stroke-width="3"/><rect x="${bx}" y="${by}" width="136" height="60" rx="12" fill="${fill}" stroke="#14211f" stroke-width="3.5"/>
  <text x="${x}" y="${by+22}" text-anchor="middle" font-size="19" font-weight="700" fill="#14211f">${o.n}</text><text x="${x}" y="${by+49}" text-anchor="middle" font-size="26" font-weight="700" fill="#14211f">${fT(vals[k])} °C</text>
  <circle cx="${x}" cy="${y}" r="9" fill="#b3302a" stroke="#1c2420" stroke-width="3"/><text x="${x}" y="${y+28}" text-anchor="middle" font-size="17" fill="#14211f" stroke="#c5d3ae" stroke-width="5" paint-order="stroke">${o.h} m</text>`});
 return s+'</svg>'}

/* ---------- Ansichten ---------- */
const stepper=n=>{const l=['Vermuten','Spuren sichern','Prüfen'];return `<ol class="steps" aria-label="Schritte">`+l.map((t,i)=>`<li class="${i+1===n?'on':i+1<n?'done':''}"><i>${i+1<n?'✓':i+1}</i>${t}</li>`).join('')+`</ol>`};
const head=(n,t)=>`<div class="gbar"><button class="back" data-act="home">← Alle Akten</button><div class="ttl"><small>Akte 0${n}</small>${t}</div></div><div class="qcard">`;
const loading=()=>`<div class="load" role="status">Spuren werden gesucht …</div>`;
const failBox=()=>`<div class="fail" role="alert"><b>Die Messwerte kommen gerade nicht an.</b><p>Warte kurz. Tippe dann auf «Nochmals».</p><button class="btn" data-act="retry">Nochmals</button><details><summary>Für die Lehrperson</summary><p class="muted">${esc(DIAG.slice(-8).join(' | ')||'–')}<br>${esc(S.err||'')}</p></details></div>`;
const noteBox=(lines)=>`<div class="note"><b>✏ Schreib in dein Heft:</b>${lines.map(l=>`<p>${l}</p>`).join('')}</div>`;
const doneBtns=(id)=>`<div class="actions"><button class="btn" data-act="solve" data-v="${id}">Akte schliessen ✓</button><button class="btn light" data-act="again" data-v="${id}">Nochmals von vorn</button></div>`;
const FB=(cls,t,body,id)=>`<div class="fb ${cls}" ${id?'id="fb"':''} tabindex="-1" role="status">${cls===''?'<span class="stp">Spur bestätigt</span>':''}<strong>${t}</strong>${body}</div>`;
const winTxt=(hit)=>hit?'Stimmt! Gut vermutet.':'';

function viewHome(){
 const n=Object.keys(solved).filter(k=>solved[k]).length;
 const A=[['1','Der warme Tag','Wann ist es am wärmsten?'],['2','Zwei Tage','Welcher Tag war wärmer?'],['3','Drei Orte','Wo ist es am kältesten?']];
 return `<section class="cover"><div class="bigstamp" aria-hidden="true">Streng<b>GEHEIM</b>Wetter</div>
 <h1><span>Klima-Kommissariat 4b</span>Klimadetektive</h1>
 <p>Du ermittelst in drei Akten. Erst vermutest du. Dann prüfst du die Spur mit echten Messwerten. Zum Schluss schreibst du ins Heft.</p>
 <div id="now" class="now" aria-live="off"><small>Jetzt in Zürich …</small></div></section>
 <div class="files">${A.map(([i,t,q])=>`<div class="file"><span class="tab">Akte 0${i}</span><h3>${t}</h3><p>${q}</p><div class="foot"><span class="stars ${solved[i]?'on':''}" aria-label="${solved[i]?'gelöst':'offen'}">${solved[i]?'★':'☆'}</span><button class="open" data-act="open" data-v="${i}">Akte öffnen</button></div>${solved[i]?'<span class="solvedst">GELÖST</span>':''}</div>`).join('')}</div>
 ${n===3?`<div class="qcard" style="margin-top:22px"><div class="fb"><span class="stp">Alle Akten gelöst</span><strong>Gut ermittelt!</strong>Du bist jetzt Klimadetektiv oder Klimadetektivin.</div></div>`:''}`}

const chkRow=(f,k,t)=>`<label class="chk"><input type="checkbox" data-act="chk" data-f="${f}" data-k="${k}" ${S['f'+f].c[k]?'checked':''} ${S['f'+f].show?'disabled':''}><span>${t}</span></label>`;
const VERM={1:['a'],2:['a'],3:['a','b']};
const vermOK=f=>VERM[f].every(k=>S['f'+f].c[k]);
const taskOK=f=>Object.keys(S['f'+f].c).filter(k=>!VERM[f].includes(k)).every(k=>S['f'+f].c[k]);
const stepOf=f=>!vermOK(f)?1:(!S['f'+f].show?2:3);
const box=(t,inner)=>`<div class="auftrag"><h3>${t}</h3>${inner}</div>`;
const ol=l=>`<ol>${l.map(x=>`<li>${x}</li>`).join('')}</ol>`;
const checks=(f,arr)=>arr.map(([k,t])=>chkRow(f,k,t)).join('');
const stepV=(f,lines,arr)=>box('1 · Vermuten',ol(lines)+checks(f,arr));
const stationBody=(f,fn)=>{const st=S['f'+f];if(S.loading&&!st.res)return loading();if(S.err&&!st.res)return failBox();return st.res?fn(st.res):''};
const stepT=(f,lines,arr,ti)=>{const st=S['f'+f],ok=taskOK(f);return box(ti||'3 · Eintragen und malen',ol(lines)+checks(f,arr)+(st.show?'':`<div class="actions"><button class="btn" data-act="show" data-v="${f}" ${ok?'':'disabled'}>Lösung zeigen</button>${ok?'':'<span class="muted">Hake zuerst alles ab.</span>'}</div>`))};
function selfBox(f,q){const st=S['f'+f];
 let h=`<h3>Prüfe dich</h3><p class="q">${q}</p><div class="opts two">`+[['j','Ja'],['f','Fast'],['n','Nein']].map(([k,l])=>`<button class="opt" data-act="self" data-f="${f}" data-v="${k}" aria-pressed="${st.self===k}">${l}</button>`).join('')+`</div>`;
 if(st.self==='j')h+=FB('','Gut ermittelt!','<p>Deine Vermutung stimmte.</p>');
 else if(st.self==='f')h+=FB('near','Fast!','<p>Schau nochmals: Was war anders?</p>');
 else if(st.self==='n')h+=FB('no','Auch Detektive irren sich.','<p>Das ist normal. Was hast du jetzt gelernt?</p>');
 return h}
const EXP={};
const explore=(t,inner,id,open)=>`<details class="explore" data-id="${id}" ${(open||EXP[id])?'open':''}><summary>${t}</summary>${inner}</details>`;
const emptyBox=m=>FB('no','Hier fehlt die Spur.',`<p>${m}</p>`);

/* ----- Akte 1 ----- */
function viewF1(){const f=S.f1,ok=vermOK(1);
 let h=head(1,'Der warme Tag')+stepper(stepOf(1))+stepV(1,['Schreib auf dem Blatt auf: <b>Wann ist es am wärmsten?</b> Ich vermute: …'],[['a','Ich habe meine Vermutung aufgeschrieben.']]);
 if(ok)h+=box('2 · Spuren sichern',ol(['Lies die Temperaturen ab. Schreib sie in die Tabelle auf dem Blatt.'])+stationBody(1,st1)+explore('Anderen Tag wählen (Tag verpasst?)',chipsFor('f1',f.day),'e1'));
 if(ok&&f.res&&!f.res.empty)h+=stepT(1,[`Male auf <b>KM 54.2</b> deine <span class="rot">rote Kurve</span> (Tag 1: ${dlabel(FIX[0])}).`],[['b','Ich habe die Temperaturen eingetragen.'],['c','Ich habe die rote Kurve gemalt.']]);
 if(f.show&&f.res&&!f.res.empty)h+=sol1(f.res);
 return h}
function st1(r){if(r.empty)return emptyBox('Für diesen Tag gibt es keine Messwerte. Wähle einen anderen Tag.');
 return `<p class="muted">Temperatur am ${dlabel(S.f1.day)}, in °C${r.partial?' (der Tag ist noch nicht zu Ende)':''}</p><div class="cells">`+[8,10,12,14,16,18,20].map((hh,i)=>`<div class="cell"><span>${hh} Uhr</span><b>${fT(r.h2[i])}</b></div>`).join('')+`</div>`}
function sol1(r){const f=S.f1;
 let h='<h3>Die Lösung</h3>'+FB('info','Am wärmsten war es um '+hm(r.mx.m)+' Uhr.',`<p><b>${fT(r.mx.T)} °C</b> (${dlabel(f.day)}) Am kältesten: ${hm(r.mn.m)} Uhr, ${fT(r.mn.T)} °C.</p>`,1);
 h+=`<div class="fig">${lineChart({series:[{pts:r.s,color:'#d62828'}],dots:r.dots,flags:[{m:r.mx.m,T:r.mx.T,text:fT(r.mx.T)+' °C',color:'#f2d24b',pos:'up'},{m:r.mn.m,T:r.mn.T,text:fT(r.mn.T)+' °C',color:'#cfe0f7',pos:'down'}],aria:'Temperatur am '+dlabel(f.day)+' von 8 bis 20 Uhr. Am wärmsten um '+hm(r.mx.m)+' Uhr, '+fT(r.mx.T)+' Grad.'})}</div><p class="muted">Gelb: am wärmsten. Blau: am kältesten. Vergleiche mit deiner roten Kurve.</p>`;
 h+=selfBox(1,'Hat deine Vermutung gestimmt?');
 h+=noteBox([`Am <b>${dlabel(f.day)}</b> war es um <span class="blank">${hm(r.mx.m)}</span> Uhr am wärmsten: <span class="blank">${fT(r.mx.T)}</span> °C.`,`Meine Vermutung war <span class="blank">richtig / nicht ganz richtig</span>.`])+`<p class="think">Denk nach: Was macht die Luft warm?</p>`;
 return h+doneBtns('1')}

/* ----- Akte 2 ----- */
function viewF2(){const f=S.f2,ok=vermOK(2);
 let h=head(2,'Zwei Tage')+stepper(stepOf(2))+stepV(2,['Schreib auf dem Blatt auf: <b>Welcher Tag war wärmer?</b> Ich vermute: …'],[['a','Ich habe meine Vermutung aufgeschrieben.']]);
 if(ok)h+=box('2 · Spuren sichern',ol(['Lies die Temperaturen von Tag 1 und Tag 2 ab. Schreib sie in die Tabelle auf dem Blatt.'])+stationBody(2,st2)+explore('Andere Tage wählen (Tag verpasst?)',`<h3>Rote Kurve</h3>`+chipsFor('f2a',f.a,f.b)+`<h3>Blaue Kurve</h3>`+chipsFor('f2b',f.b,f.a),'e2'));
 if(ok&&f.res&&!f.res.empty)h+=stepT(2,[`Male auf <b>KM 54.2</b> die <span class="rot">rote Kurve</span> (Tag 1: ${dlabel(FIX[0])}) und die <span class="blau">blaue Kurve</span> (Tag 2: ${dlabel(FIX[1])}).`],[['b','Ich habe die Temperaturen eingetragen.'],['c','Ich habe die rote Kurve gemalt.'],['d','Ich habe die blaue Kurve gemalt.']]);
 if(f.show&&f.res&&!f.res.empty)h+=sol2(f.res);
 return h}
function st2(r){if(r.empty)return emptyBox(`Für ${esc(r.empty)} gibt es keine Messwerte. Wähle einen anderen Tag.`);
 const A=dlabel(S.f2.a),B=dlabel(S.f2.b);
 return `<div class="tabs"><table><thead><tr><th>Uhr</th>${[8,10,12,14,16,18,20].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody><tr><td class="l"><span class="rot">Rot</span>: ${A}</td>${r.hA.map(v=>`<td>${fT(v)}</td>`).join('')}</tr><tr><td class="l"><span class="blau">Blau</span>: ${B}</td>${r.hB.map(v=>`<td>${fT(v)}</td>`).join('')}</tr></tbody></table></div><p class="muted">Temperatur in °C${r.partial?' (ein Tag ist noch nicht zu Ende)':''}</p>`}
function sol2(r){const f=S.f2;
 const A=dlabel(f.a),B=dlabel(f.b),d=r.avgA-r.avgB,ad=Math.abs(d),truth=ad<0.5?'eq':d>0?'A':'B',warmer=truth==='A'?A:B;
 let h='<h3>Die Lösung</h3>'+(truth==='eq'?FB('info','Fast gleich warm.',`<p>Der Unterschied ist nur <b>${fT(ad)} °C</b>.</p>`,1):FB('info',warmer+' war wärmer.',`<p>Im Schnitt <b>${fT(ad)} °C</b> mehr.</p>`,1));
 h+=`<div class="two-days"><div class="day a ${truth==='A'?'win':''}"><h4><span class="rot">Rot</span>: ${A}</h4><div class="big">${fT(r.avgA)} °C</div><small>im Schnitt</small><small>am wärmsten: ${fT(r.mxA)} °C</small></div><div class="day b ${truth==='B'?'win':''}"><h4><span class="blau">Blau</span>: ${B}</h4><div class="big">${fT(r.avgB)} °C</div><small>im Schnitt</small><small>am wärmsten: ${fT(r.mxB)} °C</small></div></div><p class="muted">Schnitt = ein typischer Wert für den ganzen Tag (8 bis 20 Uhr).</p>`;
 h+=`<div class="fig">${lineChart({series:[{pts:r.sA,color:'#d62828'},{pts:r.sB,color:'#1d4ed8',dash:true}],aria:'Temperatur an zwei Tagen von 8 bis 20 Uhr: rot '+A+', blau '+B+'.'})}<div class="legend"><span><i></i>Rot: ${A}</span><span><i class="b"></i>Blau: ${B}</span></div></div><p class="muted">Vergleiche mit deinen Kurven auf KM 54.2.</p>`;
 h+=selfBox(2,'Hat deine Vermutung gestimmt?');
 h+=noteBox([truth==='eq'?`Am <b>${A}</b> und am <b>${B}</b> war es fast gleich warm.`:`Am <b>${warmer}</b> war es wärmer: im Schnitt <span class="blank">${fT(ad)}</span> °C mehr.`,`Ich vermute, dass … <span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span> weil … <span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>`])+`<p class="think">Denk nach: Was war an den Tagen anders? Sonne? Wolken? Wind?</p>`;
 return h+doneBtns('2')}

/* ----- Akte 3 ----- */
function timeChips(){const f=S.f3,t=todayKey();const o=[...(f.day===t?[['now','Jetzt']]:[]),['08','8 Uhr'],['12','12 Uhr'],['16','16 Uhr']];
 return `<div class="chips" role="group" aria-label="Zeit wählen">`+o.map(([k,l])=>`<button class="chip" data-act="time" data-v="${k}" aria-pressed="${f.time===k}">${l}</button>`).join('')+`</div>`}
function viewF3(){const f=S.f3,ok=vermOK(3);
 let h=head(3,'Drei Orte')+stepper(stepOf(3))+stepV(3,['Schreib auf: <b>Wo ist es am kältesten?</b> Lugano, Zürich oder Zermatt? Ich vermute: …','Schreib auf: <b>Je höher der Ort, desto …?</b> Ich vermute: …'],[['a','Ich habe meine erste Vermutung aufgeschrieben.'],['b','Ich habe meine zweite Vermutung aufgeschrieben.']]);
 if(ok)h+=box('2 · Spuren sichern',ol(['Wähle den Tag und die Zeit.','Lies die Temperaturen der drei Orte ab. Schreib sie in die Tabelle auf dem Blatt.'])+`<h3>Welcher Tag?</h3>${chipsFor('f3',f.day)}<h3>Welche Zeit?</h3>${timeChips()}`+stationBody(3,st3));
 if(ok&&f.res&&!f.res.empty&&f.res.n>=2)h+=stepT(3,['Trage die Temperaturen in die Tabelle auf dem Blatt ein.'],[['c','Ich habe die Temperaturen eingetragen.']],'3 · Eintragen');
 if(f.show&&f.res&&f.res.n>=2)h+=sol3(f.res);
 return h}
function st3(r){const f=S.f3,v=r.v;
 if(r.n<2)return emptyBox('Von einem Ort gibt es keine Messwerte. Wähle eine andere Zeit.');
 return `<div class="orte">`+['lug','sma','zer'].map(k=>`<div class="ort"><b>${ST[k].n}</b><small>${ST[k].kt} · ${ST[k].h} m</small><span class="t">${fT(v[k])} °C</span></div>`).join('')+`</div><p class="muted">Zeit: ${dlabel(r.day)}, ${hm(+r.key.slice(11,13)*60+ +r.key.slice(14,16))} Uhr${r.n<3?'. Von einem Ort fehlen die Messwerte.':''}</p><button class="btn light" data-act="map">${f.map?'Karte zudecken':'Wo liegen die Orte? Karte zeigen'}</button>${f.map?`<div id="map" role="img" aria-label="Karte mit Lugano, Zürich und Zermatt"></div>`:''}`}
function sol3(r){
 const v=r.v,have=['lug','sma','zer'].filter(k=>v[k]!=null);
 const cold=have.reduce((a,b)=>v[b]<v[a]?b:a),warm=have.reduce((a,b)=>v[b]>v[a]?b:a);
 let h='<h3>Die Lösung</h3>'+FB('info','Am kältesten ist es in '+ST[cold].n+'.',`<p><b>${fT(v[cold])} °C</b>. Am wärmsten: ${ST[warm].n}, ${fT(v[warm])} °C.</p>`,1);
 h+=`<div class="fig">${mountain(v)}</div><p class="muted">Blau: am kältesten. Gelb: am wärmsten.</p>`;
 const t=have.length===3?(v.lug-v.sma>=0.3&&v.sma-v.zer>=0.3?'k':v.sma-v.lug>=0.3&&v.zer-v.sma>=0.3?'w':'m'):'m';
 h+='<h3>Je höher der Ort …</h3>';
 if(t==='k')h+=FB('info','Je höher, desto kälter.','<p>Die Luft wird oben kälter.</p>');
 else if(t==='w')h+=FB('info','Heute ist es oben wärmer.','<p>Das ist selten.</p>');
 else{const pair=have.length===3&&v.zer>=v.sma-0.3?'Zermatt ist nicht kälter als Zürich.':v.sma>v.lug-0.3?'Zürich ist nicht kälter als Lugano.':'Die Werte passen nicht ganz zur Höhe.';
  h+=FB('near','Heute passt es nicht ganz.',`<p>${pair} Meistens gilt: Je höher, desto kälter.</p>${v.zer>=v.sma-0.3&&have.length===3?'<p class="muted">Bei Nebel im Mittelland kann das vorkommen.</p>':''}`)}
 h+=selfBox(3,'Haben deine Vermutungen gestimmt?');
 h+=noteBox([`<b>Lugano</b> (273 m): <span class="blank">${fT(v.lug)}</span> °C · <b>Zürich</b> (556 m): <span class="blank">${fT(v.sma)}</span> °C · <b>Zermatt</b> (1638 m): <span class="blank">${fT(v.zer)}</span> °C`,`Je höher der Ort, desto <span class="blank">${t==='k'?'kälter':t==='w'?'wärmer':'…'}</span>.`,`Ich vermute, dass … <span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span> weil … <span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>`]);
 return h+doneBtns('3')}

function render(){
 const m={home:viewHome,'1':viewF1,'2':viewF2,'3':viewF3}[S.view]||viewHome;
 $('#app').innerHTML=m()+(S.view==='home'?'':'</div>');
 if(S.view==='home')showNow();
 if(S.view==='3'&&S.f3.map&&S.f3.res)drawMap();
}

/* ---------- Jetzt-Streifen und Karte ---------- */
async function showNow(){
 try{const mp=await station('sma',todayKey()),k=newest(mp),r=mp.get(k),lag=Math.round((kms(zurichKey(Date.now()))-kms(k))/60000),el=$('#now');
  if(!el)return;
  el.innerHTML=`<small>Jetzt in Zürich:</small><b>${fT(r[1])} °C</b><span>${windWord(r[2])}</span><small>Stand ${k.slice(11)} Uhr${lag>90?' (Daten sind verspätet)':''}</small>`}
 catch(e){const el=$('#now');if(el)el.remove()}}
let LEAF=null;
function loadLeaflet(){if(window.L)return Promise.resolve();if(LEAF)return LEAF;
 LEAF=new Promise((ok,no)=>{const c=document.createElement('link');c.rel='stylesheet';c.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';document.head.appendChild(c);const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});return LEAF}
let MAPO=null;
async function drawMap(){try{await loadLeaflet()}catch(e){const el=$('#map');if(el)el.outerHTML='<p class="muted">Die Karte konnte nicht geladen werden.</p>';return}
 const el=$('#map');if(!el||!window.L)return;if(MAPO){MAPO.remove();MAPO=null}
 MAPO=L.map(el,{scrollWheelZoom:false});
 L.tileLayer('https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-farbe/default/current/3857/{z}/{x}/{y}.jpeg',{maxZoom:18,attribution:'© swisstopo'}).addTo(MAPO);
 const pts=[];['lug','sma','zer'].forEach(k=>{pts.push(ST[k].ll);L.circleMarker(ST[k].ll,{radius:10,color:'#14211f',weight:3,fillColor:'#e8453c',fillOpacity:1}).addTo(MAPO).bindTooltip(ST[k].n,{permanent:true,direction:'top',className:'lbl'})});
 MAPO.fitBounds(L.latLngBounds(pts),{padding:[40,40]})}

/* ---------- Berechnung der Spuren ---------- */
const H2=[8,10,12,14,16,18,20];
const partialDay=day=>{const n=zurichKey(Date.now());return day===n.slice(0,10)&&(+n.slice(11,13)*60+ +n.slice(14,16))<1200};
async function calc1(){const f=S.f1,mp=await station('sma',f.day),s=daySeries(mp,f.day);
 if(s.length<3)return{empty:true};
 const mx=s.reduce((a,b)=>b.T>a.T?b:a),mn=s.reduce((a,b)=>b.T<a.T?b:a);
 const h2=H2.map(h=>at(mp,f.day+'T'+p2(h)+':00'));
 return{s,mx,mn,h2,dots:H2.map((h,i)=>h2[i]!=null?{m:h*60,T:h2[i]}:null).filter(Boolean),partial:partialDay(f.day)}}
async function calc2(){const f=S.f2,[ma,mb]=await Promise.all([station('sma',f.a),station('sma',f.b)]);
 const sA=daySeries(ma,f.a),sB=daySeries(mb,f.b);
 if(sA.length<3)return{empty:dlabel(f.a)};if(sB.length<3)return{empty:dlabel(f.b)};
 const avg=a=>a.reduce((x,y)=>x+y.T,0)/a.length,mxf=a=>Math.max(...a.map(x=>x.T));
 return{sA,sB,avgA:avg(sA),avgB:avg(sB),mxA:mxf(sA),mxB:mxf(sB),hA:H2.map(h=>at(ma,f.a+'T'+p2(h)+':00')),hB:H2.map(h=>at(mb,f.b+'T'+p2(h)+':00')),partial:partialDay(f.a)||partialDay(f.b)}}
async function calc3(){const f=S.f3,codes=['lug','sma','zer'];
 const res=await Promise.allSettled(codes.map(c=>station(c,f.day)));
 const mps={};res.forEach((x,i)=>{if(x.status==='fulfilled')mps[codes[i]]=x.value});
 if(!Object.keys(mps).length)throw new Error('keine Daten');
 let key;
 if(f.time==='now'){const ks=Object.values(mps).map(newest).filter(Boolean);key=ks.sort()[0]}   // gemeinsamer neuester Wert
 else key=f.day+'T'+f.time+':00';
 const v={};codes.forEach(c=>{v[c]=mps[c]?at(mps[c],key):null});
 return{v,key,day:key.slice(0,10),n:codes.filter(c=>v[c]!=null).length}}

async function run(which,scroll){
 const my=++TOKEN;S.loading=true;S.err=null;render();
 try{const r=await {1:calc1,2:calc2,3:calc3}[which]();if(my!==TOKEN)return;S['f'+which].res=r}
 catch(e){if(my!==TOKEN)return;S.err=e.message||'Fehler'}
 S.loading=false;render();
 if(scroll){const fb=$('#fb');if(fb){try{fb.scrollIntoView({block:'start',behavior:'smooth'});fb.focus({preventScroll:true})}catch(e){}}}}
function afterChange(w){const f=S['f'+w];f.self=null;f.res=null;if(vermOK(w))run(+w,false);else{TOKEN++;S.loading=false;S.err=null;render()}}
function restart(w){TOKEN++;S.loading=false;S.err=null;const f=S['f'+w];f.show=false;f.res=null;f.self=null;Object.keys(f.c).forEach(k=>f.c[k]=false)}
const setDay=(g,v)=>{S.cust=null;const t=todayKey();
 if(g==='f1'){S.f1.day=v;afterChange(1)}
 else if(g==='f2a'){S.f2.a=v;afterChange(2)}
 else if(g==='f2b'){S.f2.b=v;afterChange(2)}
 else if(g==='f3'){S.f3.day=v;if(v!==t&&S.f3.time==='now')S.f3.time='12';afterChange(3)}};

/* ---------- Klicks ---------- */
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT')return;const a=b.dataset.act,v=b.dataset.v,g=b.dataset.g;
 if(a==='home'){TOKEN++;S.view='home';S.loading=false;S.err=null;S.cust=null;render();scrollTo(0,0)}
 else if(a==='open'){S.view=v;render();scrollTo(0,0)}
 else if(a==='day')setDay(g,v);
 else if(a==='cust'){S.cust=S.cust===g?null:g;render();const i=document.querySelector('input[type=date]');if(i)i.focus()}
 else if(a==='time'){S.f3.time=v;afterChange(3)}
 else if(a==='show'){if(!taskOK(+v))return;S['f'+v].show=true;render();const fb=$('#fb');if(fb){try{fb.scrollIntoView({block:'start',behavior:'smooth'});fb.focus({preventScroll:true})}catch(e){}}}
 else if(a==='self'){S['f'+b.dataset.f].self=v;render()}
 else if(a==='map'){S.f3.map=!S.f3.map;render()}
 else if(a==='retry'){const w=+S.view;S.err=null;if(w&&vermOK(w))run(w,false)}
 else if(a==='solve'){solved[v]=true;saveSolved();S.view='home';render();scrollTo(0,0)}
 else if(a==='again'){restart(v);render();scrollTo(0,0)}
});
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.classList&&d.classList.contains('explore'))EXP[d.dataset.id]=d.open},true);
document.addEventListener('change',e=>{const i=e.target;
 if(i.dataset.act==='chk'){const f=i.dataset.f,k=i.dataset.k;S['f'+f].c[k]=i.checked;if(vermOK(+f)&&!S['f'+f].res&&!S.loading)run(+f,false);else render();const n=document.querySelector(`[data-act=chk][data-f="${f}"][data-k="${k}"]`);if(n)n.focus();return}
 if(i.dataset.act!=='cday'||!i.value)return;const v=i.value;if(v>todayKey())return;setDay(i.dataset.g,v);S.cust=i.dataset.g;render()});
render();
</script>
